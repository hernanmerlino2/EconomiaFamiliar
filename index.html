<!doctype html>
<html lang="es-AR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="description" content="Ingresos, gastos, ahorro, inversiones y patrimonio de la familia, con inflación y dólar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<title>Economía familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --paper:#EEF1EC;--surface:#FFFFFF;--surface-2:#F5F7F3;--sunken:#E4E9E2;
  --ink:#14213D;--ink-2:#46526A;--ink-3:#727D94;--line:#D3DACF;--line-strong:#B6C0B2;
  --celeste:#2B6CA8;--celeste-ink:#FFFFFF;--celeste-soft:#DDE9F5;
  --good:#24764F;--good-soft:#DCEFE4;--warn:#946006;--warn-soft:#F5E9CF;--bad:#AE3522;--bad-soft:#F6DED8;
  --violet:#6B5CA5;
  --side-bg:#14213D;--side-ink:#D9E1EC;--side-ink-2:#8E9BB2;--side-active:#22345A;
  --r-lg:14px;--r:9px;--r-sm:6px;--sidebar:244px;
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#0D1420;--surface:#141D2C;--surface-2:#182335;--sunken:#101927;
  --ink:#E7ECF3;--ink-2:#A9B4C5;--ink-3:#7E8A9E;--line:#243248;--line-strong:#34465F;
  --celeste:#7DB0E3;--celeste-ink:#0D1420;--celeste-soft:#1A2D45;
  --good:#5BC495;--good-soft:#143326;--warn:#E5B04E;--warn-soft:#382B12;--bad:#F2826E;--bad-soft:#3D1D18;
  --violet:#A99BE0;
  --side-bg:#0A111C;--side-ink:#D9E1EC;--side-ink-2:#7F8CA3;--side-active:#18263C;
  color-scheme:dark;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--celeste)}
:focus-visible{outline:2px solid var(--celeste);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.stack>*+*{margin-top:16px}
p{margin:0 0 8px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.brand svg{flex-shrink:0;color:#7DB0E3}
.brand-name{font-weight:700;font-stretch:112%;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.brand-sub{font-size:12px;color:var(--side-ink-2)}
.nav{padding:4px 10px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14.5px;margin-bottom:1px}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 #7DB0E3;font-weight:600}
.nav a.soon{color:var(--side-ink-2)}
.nav .tag{margin-left:auto;font-size:11px;color:var(--side-ink-2);border:1px solid #33445F;border-radius:20px;padding:0 7px}
.nav-sep{height:1px;background:#26365A;margin:8px 12px}
.side-foot{padding:14px 20px 20px;font-size:12px;color:var(--side-ink-2);line-height:1.45}
.sync{display:flex;align-items:center;gap:7px;margin-top:6px;color:var(--side-ink)}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#7DB0E3}
.sync-dot.good{background:#5BC495}.sync-dot.warn{background:#E5B04E}.sync-dot.bad{background:#F2826E}
#gate{position:fixed;inset:0;z-index:90;background:var(--paper);display:none;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px 20px;overflow-y:auto}
#gate.open{display:flex}
.gate-card{position:relative;overflow:hidden;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 26px}
.gate-card .guilloche{position:absolute;right:-170px;top:-80px;width:340px;height:340px;color:var(--celeste);opacity:.18;pointer-events:none}
.gate-card h1{position:relative;font-size:25px;font-stretch:114%;letter-spacing:-.015em;margin:0 0 4px}
.gate-card>p,.gate-card .notice{position:relative}
.gate-card form{position:relative;display:grid;gap:12px;margin-top:16px}
.gate-card .btn{justify-content:center}
.gate-links{position:relative;display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13.5px;flex-wrap:wrap}
.linklike{border:0;background:none;color:var(--celeste);cursor:pointer;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.side-link{color:var(--side-ink-2);margin-top:8px;font-size:12px}
.topbar{padding-top:max(14px,env(safe-area-inset-top))}
.sidebar{padding-top:env(safe-area-inset-top)}
#view{padding-bottom:max(48px,env(safe-area-inset-bottom))}
code{font-size:13px;background:var(--sunken);padding:1px 6px;border-radius:5px;word-break:break-all}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.topbar h1{font-size:21px;font-weight:650;font-stretch:108%;margin:0;letter-spacing:-.01em}
.topbar .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.month-nav{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);overflow:hidden}
.month-nav select{border:0;background:transparent;padding:7px 4px;min-width:150px;text-align:center;cursor:pointer}
.month-nav button{border:0;background:transparent;padding:7px 8px;cursor:pointer;color:var(--ink-2);display:flex}
.month-nav button:hover{background:var(--surface-2)}
.menu-btn{display:none}
#view{padding:24px 28px 48px;max-width:1320px;width:100%}
#view:focus{outline:none}

/* Components */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--celeste);border-color:var(--celeste);color:var(--celeste-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--celeste)}
.btn.ghost:hover{background:var(--celeste-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:progress}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:7px;cursor:pointer;color:var(--ink-2);display:inline-flex}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.panel-head h2{font-size:16px;font-weight:650;margin:0;letter-spacing:-.005em}
.panel-sub{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.panel-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:14px 18px 18px}
.grid{display:grid;gap:16px;margin-top:16px}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-21{grid-template-columns:1.6fr 1fr}
.g-12{grid-template-columns:1fr 1.6fr}

.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 28px 24px}
.hero .guilloche{position:absolute;right:-90px;top:50%;transform:translateY(-50%);width:420px;height:420px;color:var(--celeste);opacity:.22;pointer-events:none}
.hero-month{font-size:14px;color:var(--ink-3);margin-bottom:6px;position:relative}
.hero-line{position:relative;font-size:clamp(21px,2.3vw,29px);line-height:1.3;font-stretch:104%;font-weight:420;max-width:30em;margin:0 0 10px;letter-spacing:-.012em}
.hero-line .fig{font-weight:700;font-stretch:118%;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero-sub{position:relative;color:var(--ink-2);max-width:62ch;margin:0}
.hero .row{position:relative;margin-top:14px}

.ledger{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:16px;overflow:hidden}
.ledger .cell{padding:15px 18px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.ledger .cell:nth-child(4n){border-right:0}
.ledger .cell:nth-last-child(-n+4){border-bottom:0}
.cell-label{font-size:13px;color:var(--ink-2)}
.cell-value{font-size:22px;font-weight:700;font-stretch:115%;letter-spacing:-.01em;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.cell-sub .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.neutral,.badge.info{background:var(--sunken);color:var(--ink-2)}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button,.seg a{border:0;background:transparent;padding:5px 11px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink-2);border-right:1px solid var(--line)}
.seg>*:last-child{border-right:0}
.seg .on{background:var(--celeste-soft);color:var(--ink);font-weight:650}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:550}
.tabs button.on{color:var(--ink);border-bottom-color:var(--celeste)}

.chart-box{position:relative;width:100%}
.chart-fallback{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3);font-size:13px;text-align:center;padding:12px;border:1px dashed var(--line);border-radius:var(--r)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td{background:var(--surface-2)}
table.data .n{text-align:right;white-space:nowrap}
table.data tfoot td{font-weight:650;background:var(--surface-2);border-top:1px solid var(--line-strong)}
.cell-main{font-weight:550}
.cell-meta{font-size:12.5px;color:var(--ink-3)}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.nowrap{white-space:nowrap}
td.actions{white-space:nowrap;text-align:right;padding:4px 8px}

.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2);cursor:pointer}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%}
.form-error{grid-column:1/-1;color:var(--bad);font-size:13.5px;min-height:1px}

#modalRoot{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
#modalRoot.open{display:flex}
.backdrop{position:fixed;inset:0;background:rgba(10,17,30,.5)}
.modal{position:relative;background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:620px;box-shadow:0 24px 60px rgba(10,17,30,.35);border:1px solid var(--line)}
.modal.narrow{max-width:460px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:17px;font-weight:650}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 12px}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

#toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 36px))}
.toast{display:flex;gap:9px;align-items:flex-start;background:var(--ink);color:var(--paper);padding:11px 14px;border-radius:var(--r);font-size:14px;box-shadow:0 10px 30px rgba(10,17,30,.25);animation:tin .18s ease-out}
.toast.error{background:var(--bad);color:#fff}
.toast svg{flex-shrink:0;margin-top:2px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.insights{list-style:none;margin:0;padding:0}
.insights li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.insights li:last-child{border-bottom:0}
.insights .ic{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.ic.good{background:var(--good-soft);color:var(--good)}
.ic.warn{background:var(--warn-soft);color:var(--warn)}
.ic.bad{background:var(--bad-soft);color:var(--bad)}
.ic.info{background:var(--celeste-soft);color:var(--celeste)}

.indicators{display:grid;grid-template-columns:1fr;gap:0}
.indicator{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.indicator:last-child{border-bottom:0}
.indicator .lbl{font-size:14px}
.indicator .lbl small{display:block;color:var(--ink-3);font-size:12px}
.indicator .val{display:flex;align-items:center;gap:8px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}

.cat-legend{list-style:none;margin:12px 0 0;padding:0;font-size:13.5px}
.cat-legend li{display:flex;align-items:center;gap:8px;padding:4px 0}
.cat-legend .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.cat-legend .pc{width:46px;text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}

.explain{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.55}
.explain .formula{font-variant-numeric:tabular-nums;font-weight:600}
.verdict{font-size:19px;font-weight:650;font-stretch:108%;margin:4px 0 8px;letter-spacing:-.01em}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:13.5px;margin-bottom:14px}
.notice svg{color:var(--warn);flex-shrink:0;margin-top:2px}
.notice.info{background:var(--celeste-soft)}
.notice.info svg{color:var(--celeste)}

.empty{text-align:center;padding:40px 20px;color:var(--ink-2)}
.empty h2{font-size:22px;font-stretch:110%;margin:0 0 8px;color:var(--ink)}
.empty p{max-width:52ch;margin:0 auto 18px}
.empty .row{justify-content:center}

.rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.rate-card{padding:16px 18px;border-right:1px solid var(--line)}
.rate-card:last-child{border-right:0}
.rate-card .name{font-weight:650}
.rate-card .sell{font-size:26px;font-weight:700;font-stretch:118%;margin:2px 0;font-variant-numeric:tabular-nums}
.rate-card .meta{font-size:12.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px;align-items:flex-start}

.cat-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-item{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.cat-head{display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 4px 1px 10px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--ink-3);padding:0 5px;font-size:14px;line-height:1.2}
.chip button:hover{color:var(--bad)}
.chip.add{padding:1px 10px;cursor:pointer;color:var(--celeste);border-style:dashed;background:transparent}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}

@media (max-width:1100px){
  .g-3{grid-template-columns:1fr 1fr}
  .settings-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .2s ease}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .g-2,.g-21,.g-12,.g-3{grid-template-columns:1fr}
  .ledger{grid-template-columns:1fr 1fr}
  .ledger .cell:nth-child(4n){border-right:1px solid var(--line)}
  .ledger .cell:nth-child(2n){border-right:0}
  .ledger .cell:nth-last-child(-n+4){border-bottom:1px solid var(--line)}
  .ledger .cell:nth-last-child(-n+2){border-bottom:0}
  .rate-grid{grid-template-columns:1fr 1fr}
  .rate-card:nth-child(2n){border-right:0}
  .rate-card:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .cat-list{grid-template-columns:1fr}
  #view{padding:18px 16px 40px}
  .topbar{padding:12px 16px}
}
@media (max-width:560px){
  .form-grid,.settings-grid{grid-template-columns:1fr}
  .topbar h1{font-size:17px}
  .month-nav select{min-width:118px}
  .cell-value{font-size:19px}
  .hero{padding:20px}
  .hero .guilloche{width:300px;height:300px;right:-120px;opacity:.14}

<script>
'use strict';

/* =====================================================================
   1. CONSTANTES Y UTILIDADES
   ===================================================================== */
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad = n => String(n).padStart(2, '0');
const $ = sel => document.querySelector(sel);

const U = {
  uid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* contexto no seguro */ }
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  },
  isoLocal(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
  today() { return U.isoLocal(new Date()); },
  thisMonth() { return U.today().slice(0, 7); },
  addMonths(ym, n) {
    const [y, m] = ym.split('-').map(Number);
    const t = y * 12 + (m - 1) + n;
    return `${Math.floor(t / 12)}-${pad(t % 12 + 1)}`;
  },
  addDays(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    return U.isoLocal(new Date(y, m - 1, d + n));
  },
  daysInMonth(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); },
  monthsBetween(a, b) {
    const out = [];
    if (!a || !b || a > b) return out;
    for (let x = a; x <= b; x = U.addMonths(x, 1)) out.push(x);
    return out;
  },
  monthLabel(ym, short = false) {
    if (!ym) return '';
    const [y, m] = ym.split('-').map(Number);
    const n = MONTHS[m - 1];
    return short ? `${n.slice(0, 3)} ${String(y).slice(2)}` : `${n} ${y}`;
  },
  cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; },
  dateLabel(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; },
  nf0: new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }),
  nf1: new Intl.NumberFormat('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
  nf2: new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  nfc: new Intl.NumberFormat('es-AR', { notation: 'compact', maximumFractionDigits: 1 }),
  ars(n) { if (n == null || !isFinite(n)) return '—'; return (n < 0 ? '−' : '') + '$ ' + U.nf0.format(Math.abs(Math.round(n))); },
  usd(n) { if (n == null || !isFinite(n)) return '—'; return (n < 0 ? '−' : '') + 'US$ ' + U.nf0.format(Math.abs(Math.round(n))); },
  money(n, cur) { return cur === 'USD' ? U.usd(n) : U.ars(n); },
  pct(n, dec = 1, sign = false) {
    if (n == null || !isFinite(n)) return '—';
    const v = Math.abs(n).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return (n < 0 ? '−' : (sign && n > 0 ? '+' : '')) + v + ' %';
  },
  compact(n) { return U.nfc.format(n); },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  num(v) { const x = typeof v === 'number' ? v : parseFloat(v); return isFinite(x) ? x : 0; },
  sum(arr, f = x => x) { return arr.reduce((a, b) => a + (+f(b) || 0), 0); },
  avg(arr) { const a = arr.filter(x => x != null && isFinite(x)); return a.length ? U.sum(a) / a.length : null; },
  change(cur, prev) { return (prev && isFinite(prev) && prev !== 0 && cur != null && isFinite(cur)) ? (cur / prev - 1) * 100 : null; },
  round(n, step = 1) { return Math.round(n / step) * step; },
  rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; },
  download(name, content, mime) {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  readFile(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsText(file);
    });
  },
  parseDate(s) {
    s = String(s || '').trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return null;
  }
};

const STORAGE_KEY = 'economia-familiar:v1';
const COLLECTIONS = ['users','income','expenses','categories','budgets','creditCards','installments','investments','assets','liabilities','financialGoals','exchangeRates','inflation','monthlySnapshots'];
const INCOME_TYPES = ['Sueldo','Bono','Venta','Emprendimiento','Intereses','Dividendos','Inversión','Alquiler','Otros'];
const PAY_METHODS = ['Efectivo','Débito','Crédito','Transferencia','Mercado Pago','Otro'];
const EXPENSE_KINDS = [{ id: 'fijo', label: 'Fijo' }, { id: 'variable', label: 'Variable' }, { id: 'extraordinario', label: 'Extraordinario' }];
const CURRENCIES = [{ id: 'ARS', label: 'ARS (pesos)' }, { id: 'USD', label: 'USD (dólares)' }];
const INVESTMENT_TYPES = ['Dólares','Acciones','CEDEARs','Bonos','Fondos comunes de inversión','Money Market','Plazo fijo','Criptomonedas','Fondos de retiro','Otros'];
const LIQUID_INVESTMENTS = ['Dólares','Money Market','Plazo fijo'];
const ASSET_TYPES = [
  { id: 'efectivo', label: 'Efectivo', liquid: true },
  { id: 'banco', label: 'Cuenta bancaria', liquid: true },
  { id: 'billetera', label: 'Billetera virtual', liquid: true },
  { id: 'dolares', label: 'Dólares físicos', liquid: true },
  { id: 'vehiculo', label: 'Vehículo' },
  { id: 'propiedad', label: 'Propiedad' },
  { id: 'otro', label: 'Otro bien' }
];
const DOLLAR_TYPES = [{ id: 'oficial', label: 'Oficial' }, { id: 'blue', label: 'Blue' }, { id: 'mep', label: 'MEP' }, { id: 'ccl', label: 'CCL' }];
const dollarLabel = id => (DOLLAR_TYPES.find(t => t.id === id) || {}).label || id;
const CAT_COLORS = ['#2B6CA8','#24764F','#C98A12','#AE3522','#6B5CA5','#1B8A8F','#C0618A','#7A8B2E','#8C5A3C','#4C7FD1','#D27A2C','#3E9E74','#9A4F9E','#5E6C84','#B8902F','#2C5E7A','#A35048','#5A9BD5'];

const DEFAULT_SETTINGS = {
  members: ['Hernán', 'Esposa'],
  currency: 'ARS',
  dollarType: 'mep',
  savingsGoal: 20,
  emergencyMonths: 6,
  theme: null,
  rateProvider: 'dolarapi',
  inflationProvider: 'argentinadatos'
};

function defaultCategories() {
  const base = [
    ['Vivienda', ['Alquiler / Hipoteca','Expensas','Mantenimiento','Seguro hogar']],
    ['Servicios', ['Luz','Gas','Agua','Internet','Celular','Streaming']],
    ['Alimentación', ['Supermercado','Verdulería','Carnicería','Dietética','Delivery','Restaurantes']],
    ['Transporte', ['Combustible','Seguro','Patente','Mantenimiento vehículo','Estacionamiento','Transporte público']],
    ['Salud', ['Obra social','Medicamentos','Consultas','Odontología']],
    ['Educación', ['Cuota escolar','Idiomas','Materiales','Cursos']],
    ['Ropa', ['Indumentaria','Calzado']],
    ['Gimnasio / deporte', ['Gimnasio','Club','Fútbol','Rugby']],
    ['Ocio', ['Salidas','Hobbies','Eventos']],
    ['Vacaciones', ['Alojamiento','Pasajes','Gastos de viaje']],
    ['Mascotas', ['Alimento','Veterinaria']],
    ['Hijos', ['Escuela','Actividades','Ropa']],
    ['Regalos', ['Cumpleaños','Fiestas']],
    ['Compras extraordinarias', ['Electrodomésticos','Tecnología','Muebles']],
    ['Impuestos', ['Monotributo','Rentas','Impuesto municipal','Otros impuestos']],
    ['Deudas', ['Crédito hipotecario','Préstamo personal','Intereses de tarjeta']],
    ['Otros', ['Varios']]
  ];
  return base.map(([name, subs], i) => ({ id: U.uid(), name, subs, color: CAT_COLORS[i % CAT_COLORS.length] }));
}

/* =====================================================================
   2. ALMACENAMIENTO EN LA NUBE (Supabase) + COPIA LOCAL
   ===================================================================== */
/* Configuración de la nube (config.js) y tablas */
const CFG = window.EF_CONFIG || {};
const IS_RECOVERY = /type=recovery/.test(location.hash + location.search);
const CLOUD_TABLES = {
  users: 'usuarios', income: 'ingresos', expenses: 'gastos', categories: 'categorias', budgets: 'presupuestos',
  creditCards: 'tarjetas', installments: 'cuotas', investments: 'inversiones', assets: 'activos', liabilities: 'deudas',
  financialGoals: 'objetivos', exchangeRates: 'cotizaciones', inflation: 'inflacion', monthlySnapshots: 'cierres_mensuales'
};
const DATE_FIELD = { income: 'date', expenses: 'date', budgets: 'month', installments: 'date', investments: 'date', exchangeRates: 'date', inflation: 'month', monthlySnapshots: 'month' };

/* El tema es de cada dispositivo, no se comparte con la familia */
const THEME_KEY = 'economia-familiar:tema';
const LocalPrefs = {
  theme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } },
  setTheme(v) { try { localStorage.setItem(THEME_KEY, v); } catch (e) { /* sin acceso */ } }
};

/* Copia local por familia: permite abrir la app sin conexión y no perder cambios pendientes */
const LocalCache = {
  key(fid) { return `${STORAGE_KEY}:familia:${fid}`; },
  load(fid) { try { const r = localStorage.getItem(this.key(fid)); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  save(fid, d) { try { localStorage.setItem(this.key(fid), JSON.stringify(d)); } catch (e) { /* sin espacio: la nube sigue siendo la fuente */ } },
  loadOps(fid) { try { const r = localStorage.getItem(this.key(fid) + ':pendientes'); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  saveOps(fid, ops) {
    try {
      if (ops && !Ops.isEmpty(ops)) localStorage.setItem(this.key(fid) + ':pendientes', JSON.stringify(ops));
      else localStorage.removeItem(this.key(fid) + ':pendientes');
    } catch (e) { /* sin acceso */ }
  },
  clearAll() { try { Object.keys(localStorage).filter(k => k.startsWith(STORAGE_KEY)).forEach(k => localStorage.removeItem(k)); } catch (e) { /* sin acceso */ } }
};

/* Operaciones pendientes por registro: { colls: { gastos: { up: {id: registro}, del: [ids] } }, settings } */
const Ops = {
  empty() { return { colls: {}, settings: null }; },
  isEmpty(o) { return !o || (!o.settings && Object.values(o.colls || {}).every(c => !Object.keys(c.up).length && !c.del.length)); },
  coll(o, c) { return o.colls[c] || (o.colls[c] = { up: {}, del: [] }); },
  merge(base, newer) {
    const out = { colls: {}, settings: (newer && newer.settings) || (base && base.settings) || null };
    const dels = {};
    for (const src of [base, newer]) {
      if (!src) continue;
      for (const [c, o] of Object.entries(src.colls || {})) {
        const t = Ops.coll(out, c), s = dels[c] || (dels[c] = new Set());
        o.del.forEach(id => { delete t.up[id]; s.add(id); });
        Object.entries(o.up).forEach(([id, r]) => { t.up[id] = r; s.delete(id); });
      }
    }
    for (const c in dels) out.colls[c].del = [...dels[c]];
    return out;
  },
  apply(d, o) {
    const out = { ...d };
    for (const [c, x] of Object.entries(o.colls || {})) {
      const drop = new Set([...x.del, ...Object.keys(x.up)]);
      out[c] = (d[c] || []).filter(r => !drop.has(String(r.id))).concat(Object.values(x.up));
    }
    if (o.settings) out.settings = o.settings;
    return out;
  }
};

function settingsForSync(s) { if (!s) return null; const { theme, ...rest } = s; return rest; }

/* Foto de los datos para detectar qué registros cambiaron desde el último envío */
const Snap = {
  of(d) {
    const out = { settings: JSON.stringify(settingsForSync(d.settings)), colls: {} };
    COLLECTIONS.forEach(c => { const m = new Map(); (d[c] || []).forEach(r => m.set(String(r.id), JSON.stringify(r))); out.colls[c] = m; });
    return out;
  },
  diff(prev, next, d) {
    const ops = Ops.empty();
    COLLECTIONS.forEach(c => {
      const a = (prev && prev.colls[c]) || new Map(), b = next.colls[c];
      let byId = null;
      for (const [id, s] of b) if (a.get(id) !== s) {
        byId = byId || new Map((d[c] || []).map(r => [String(r.id), r]));
        Ops.coll(ops, c).up[id] = byId.get(id);
      }
      for (const id of a.keys()) if (!b.has(id)) Ops.coll(ops, c).del.push(id);
    });
    if (!prev || prev.settings !== next.settings) ops.settings = settingsForSync(d.settings);
    return ops;
  },
  equal(a, b) {
    if (!a || !b || a.settings !== b.settings) return false;
    return COLLECTIONS.every(c => {
      const x = a.colls[c], y = b.colls[c];
      if (x.size !== y.size) return false;
      for (const [k, v] of x) if (y.get(k) !== v) return false;
      return true;
    });
  }
};

/* Supabase: autenticación, familia y sincronización por registro */
const Cloud = {
  sb: null, user: null, familyId: null, family: null, members: [],
  lastSent: null, pending: Ops.empty(), inflight: false, retryTimer: null, lastPull: 0,
  configured() { return !!(CFG.supabaseUrl && CFG.supabaseKey); },
  connect() {
    if (!window.supabase || !window.supabase.createClient) throw new Error('No se pudo cargar la conexión con la base de datos. Revisá que haya internet y recargá la página.');
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  },
  async loadFamily() {
    const { data, error } = await this.sb.from('familia_miembros').select('familia_id, rol, familias(id, nombre, codigo_invitacion)').eq('user_id', this.user.id).limit(1);
    if (error) throw error;
    if (!data || !data.length) return null;
    this.familyId = data[0].familia_id;
    this.family = { ...(data[0].familias || {}), rol: data[0].rol };
    const m = await this.sb.from('familia_miembros').select('user_id, rol, email').eq('familia_id', this.familyId);
    this.members = m.data || [];
    try { localStorage.setItem(`${STORAGE_KEY}:familia-actual`, JSON.stringify({ userId: this.user.id, familyId: this.familyId, family: this.family, members: this.members })); } catch (e) { /* sin acceso */ }
    return this.family;
  },
  /** Datos de la familia guardados en el dispositivo, para abrir la app sin conexión */
  cachedFamily() {
    try {
      const c = JSON.parse(localStorage.getItem(`${STORAGE_KEY}:familia-actual`) || 'null');
      if (!c || c.userId !== this.user.id) return null;
      this.familyId = c.familyId; this.family = c.family; this.members = c.members || [];
      return this.family;
    } catch (e) { return null; }
  },
  row(c, r) {
    const f = DATE_FIELD[c];
    return { familia_id: this.familyId, id: String(r.id), fecha: f ? (r[f] || null) : null, demo: !!r.demo, datos: r };
  },
  async pull() {
    const out = {};
    await Promise.all(Object.entries(CLOUD_TABLES).map(async ([c, t]) => {
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await this.sb.from(t).select('datos').eq('familia_id', this.familyId).order('id').range(from, from + 999);
        if (error) throw error;
        rows.push(...data.map(r => r.datos));
        if (data.length < 1000) break;
      }
      out[c] = rows;
    }));
    const { data: cfg, error } = await this.sb.from('config').select('settings').eq('familia_id', this.familyId).maybeSingle();
    if (error) throw error;
    out.settings = cfg ? cfg.settings : null;
    return out;
  },
  async send(ops) {
    if (ops.settings) {
      const { error } = await this.sb.from('config').upsert({ familia_id: this.familyId, settings: ops.settings }, { onConflict: 'familia_id' });
      if (error) throw error;
    }
    for (const [c, o] of Object.entries(ops.colls)) {
      const t = CLOUD_TABLES[c];
      if (!t) continue;
      const rows = Object.values(o.up).filter(Boolean).map(r => this.row(c, r));
      for (let i = 0; i < rows.length; i += 500) {
        const { error } = await this.sb.from(t).upsert(rows.slice(i, i + 500), { onConflict: 'familia_id,id' });
        if (error) throw error;
      }
      for (let i = 0; i < o.del.length; i += 100) {
        const { error } = await this.sb.from(t).delete().eq('familia_id', this.familyId).in('id', o.del.slice(i, i + 100));
        if (error) throw error;
      }
    }
  },
  /** Calcula qué cambió, lo agrega a la cola (persistida en el dispositivo) e intenta enviarlo */
  queue(d) {
    const next = Snap.of(d);
    const ops = Snap.diff(this.lastSent, next, d);
    this.lastSent = next;
    this.pending = Ops.merge(this.pending, ops);
    LocalCache.save(this.familyId, d);
    LocalCache.saveOps(this.familyId, this.pending);
    this.kick();
  },
  kick() {
    if (this.inflight) return;
    if (Ops.isEmpty(this.pending)) { if (Sync.status !== 'ok') Sync.set('ok'); return; }
    this.sendLoop();
  },
  async sendLoop() {
    this.inflight = true;
    clearTimeout(this.retryTimer);
    Sync.set('saving');
    const sending = this.pending;
    this.pending = Ops.empty();
    try {
      await this.send(sending);
      this.inflight = false;
      LocalCache.saveOps(this.familyId, this.pending);
      this.kick();
    } catch (e) {
      this.inflight = false;
      this.pending = Ops.merge(sending, this.pending);
      LocalCache.saveOps(this.familyId, this.pending);
      Sync.set('error', authMsg(e));
      this.retryTimer = setTimeout(() => this.kick(), 10000);
    }
  },
  /** Trae los cambios que haya hecho otro integrante de la familia */
  async refresh(force = false) {
    if (!this.familyId || this.inflight || !Ops.isEmpty(this.pending) || Modal.isOpen()) return false;
    if (!force && Date.now() - this.lastPull < 20000) return false;
    let srv;
    try { srv = await this.pull(); }
    catch (e) { if (force) toast(`No se pudo actualizar (${authMsg(e)}).`, 'error'); return false; }
    this.lastPull = Date.now();
    if (this.inflight || !Ops.isEmpty(this.pending)) return false;
    const d = Store.normalize(srv), snap = Snap.of(d);
    if (Snap.equal(snap, this.lastSent)) return false;
    Store.data = d;
    this.lastSent = snap;
    FX.invalidate(); Finance.invalidate();
    LocalCache.save(this.familyId, d);
    if (started && !Modal.isOpen()) render();
    return true;
  }
};

const Sync = {
  status: '', detail: '', notice: '',
  set(status, detail = '') {
    const wasError = this.status === 'error';
    this.status = status; this.detail = detail;
    if (status === 'error' && !wasError && started) toast(`No se pudo guardar en la nube (${detail}). Los cambios quedan en este dispositivo y se reintenta solo.`, 'error');
    if (status === 'ok' && wasError && started) toast('Conexión restablecida. Todo guardado.', 'good');
    renderSyncStatus();
  }
};
const SYNC_TEXT = {
  ok: ['good', 'Guardado en la nube'],
  saving: ['info', 'Guardando…'],
  error: ['bad', 'Sin conexión: cambios pendientes']
};
function renderSyncStatus() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const [lvl, text] = SYNC_TEXT[Sync.status] || SYNC_TEXT.ok;
  el.innerHTML = `<span class="sync-dot ${lvl}" aria-hidden="true"></span><span>${text}</span>`;
  el.title = Sync.detail || '';
}

function hasRecords(d) { return !!d && COLLECTIONS.some(c => c !== 'categories' && Array.isArray(d[c]) && d[c].length); }

function authMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || 'error desconocido');
  const map = [
    [/invalid login credentials/i, 'Email o contraseña incorrectos.'],
    [/email not confirmed/i, 'Todavía no confirmaste el email. Revisá tu casilla, incluida la carpeta de spam.'],
    [/already registered|already exists/i, 'Ya existe una cuenta con ese email. Ingresá o recuperá la contraseña.'],
    [/signups? not allowed|signup.*disabled/i, 'El registro de cuentas nuevas está cerrado.'],
    [/rate limit|too many/i, 'Demasiados intentos. Esperá unos minutos y volvé a probar.'],
    [/password should|weak password/i, 'La contraseña es muy débil: usá al menos 8 caracteres combinando letras y números.'],
    [/failed to fetch|networkerror|network request|load failed/i, 'no hay conexión a internet'],
    [/row-level security|permission denied/i, 'no tenés permiso sobre estos datos'],
    [/jwt expired/i, 'la sesión venció; volvé a ingresar']
  ];
  for (const [re, t] of map) if (re.test(m)) return t;
  return m;
}

const Store = {
  data: null,
  async init() {
    const fid = Cloud.familyId, ops = LocalCache.loadOps(fid);
    let srv = null, err = null;
    try { srv = await Cloud.pull(); Cloud.lastPull = Date.now(); } catch (e) { err = e; }
    if (srv) {
      Cloud.lastSent = Snap.of(srv);
      Cloud.pending = ops || Ops.empty();
      if (ops && !Ops.isEmpty(ops)) Sync.notice = 'recovered';
      this.data = this.normalize(ops ? Ops.apply(srv, ops) : srv);
      this.save();
      return true;
    }
    const cache = LocalCache.load(fid);
    if (cache) {
      this.data = this.normalize(cache);
      Cloud.lastSent = Snap.of(this.data);
      Cloud.pending = ops || Ops.empty();
      Sync.set('error', authMsg(err));
      Sync.notice = 'offline';
      Cloud.kick();
      return true;
    }
    Gate.error(`No se pudo conectar con la base de datos (${authMsg(err)}). Revisá la conexión e intentá de nuevo.`);
    return false;
  },
  normalize(d) {
    const base = { schemaVersion: 1, createdAt: new Date().toISOString(), settings: { ...DEFAULT_SETTINGS } };
    COLLECTIONS.forEach(c => { base[c] = []; });
    if (!d || typeof d !== 'object') { base.categories = defaultCategories(); return base; }
    const out = { ...base, ...d, settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) } };
    COLLECTIONS.forEach(c => { if (!Array.isArray(out[c])) out[c] = []; });
    if (!Array.isArray(out.settings.members) || out.settings.members.length < 2) out.settings.members = [...DEFAULT_SETTINGS.members];
    if (!out.categories.length) out.categories = defaultCategories();
    out.categories.forEach((c, i) => { if (!Array.isArray(c.subs)) c.subs = []; if (!c.color) c.color = CAT_COLORS[i % CAT_COLORS.length]; if (!c.id) c.id = U.uid(); });
    return out;
  },
  all(c) { return this.data[c]; },
  find(c, id) { return this.data[c].find(r => r.id === id) || null; },
  add(c, rec, save = true) {
    const r = { id: U.uid(), createdAt: new Date().toISOString(), ...rec };
    this.data[c].push(r);
    if (save) this.save();
    return r;
  },
  update(c, id, patch) {
    const r = this.find(c, id);
    if (!r) throw new Error('Registro no encontrado');
    Object.assign(r, patch, { updatedAt: new Date().toISOString() });
    this.save();
    return r;
  },
  remove(c, id) { this.data[c] = this.data[c].filter(r => r.id !== id); this.save(); },
  replace(d) { this.data = this.normalize(d); this.save(); },
  save() {
    this.data.updatedAt = new Date().toISOString();
    FX.invalidate();
    Finance.invalidate();
    if (Cloud.familyId) Cloud.queue(this.data);
    return true;
  }
};

async function enter(session) {
  if (!session) { Gate.login(); return; }
  Cloud.user = session.user;
  Gate.loading('Cargando los datos de tu familia…');
  let fam;
  try { fam = await Cloud.loadFamily(); }
  catch (e) {
    fam = Cloud.cachedFamily();
    if (!fam) { Gate.error(`No se pudo leer tu familia (${authMsg(e)}).`); return; }
  }
  if (!fam) { Gate.family(); return; }
  if (!(await Store.init())) return;
  Gate.hide();
  startApp();
}

/* =====================================================================
   3. PROVEEDORES EXTERNOS (intercambiables)
   ===================================================================== */
async function fetchJSON(url, timeout = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error(`el servidor respondió ${r.status}`);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('la consulta tardó demasiado');
    throw new Error(e.message && e.message !== 'Failed to fetch' ? e.message : 'no hay conexión o la API no permite la consulta');
  } finally { clearTimeout(t); }
}

/* =====================================================================
   4. FX: conversión por fecha, independiente de la fuente
   ===================================================================== */
const FX = {
  _idx: null,
  invalidate() { this._idx = null; },
  idx() {
    if (this._idx) return this._idx;
    const maps = {};
    // Los registros demo se cargan primero para que los reales los sobreescriban
    const sorted = [...Store.data.exchangeRates].sort((a, b) => (a.demo === b.demo ? 0 : a.demo ? -1 : 1));
    for (const r of sorted) (maps[r.type] || (maps[r.type] = new Map())).set(r.date, r);
    const out = {};
    for (const k in maps) out[k] = [...maps[k].values()].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return (this._idx = out);
  },
  series(type) { return this.idx()[type] || []; },
  anySeries(type) {
    let a = this.series(type || Store.data.settings.dollarType);
    if (!a.length) a = this.series('oficial');
    if (!a.length) { const all = this.idx(); for (const k in all) if (all[k].length) { a = all[k]; break; } }
    return a;
  },
  rateOn(date, type) {
    const a = this.anySeries(type);
    if (!a.length) return null;
    let lo = 0, hi = a.length - 1, ans = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (a[mid].date <= date) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
    return (ans >= 0 ? a[ans] : a[0]).sell;
  },
  monthRate(ym, type) {
    const a = this.anySeries(type).filter(r => r.date.slice(0, 7) === ym);
    if (a.length) return U.sum(a, r => r.sell) / a.length;
    return this.rateOn(`${ym}-${pad(U.daysInMonth(ym))}`, type);
  },
  latest(type) { const a = this.series(type); return a.length ? a[a.length - 1] : null; },
  previous(type) { const a = this.series(type); return a.length > 1 ? a[a.length - 2] : null; },
  hasRates() { return Store.data.exchangeRates.length > 0; },
  toARS(amount, currency, date) {
    const v = +amount || 0;
    if (currency !== 'USD') return v;
    const r = this.rateOn(date || U.today());
    return r ? v * r : 0;
  }
};

/* =====================================================================
   5. ANALYTICS: lógica financiera pura
   ===================================================================== */
const emptyMonth = () => ({ income: 0, expenses: 0, fixed: 0, variable: 0, extra: 0, investment: 0, byCat: {}, incomeByType: {}, count: 0 });

const Finance = {
  _c: null,
  invalidate() { this._c = null; },
  cache() {
    if (this._c) return this._c;
    const months = {};
    const g = k => months[k] || (months[k] = emptyMonth());
    const d = Store.data;
    for (const r of d.income) {
      if (!r.date) continue;
      const v = FX.toARS(r.amount, r.currency, r.date);
      const t = g(r.date.slice(0, 7));
      t.income += v; t.count++;
      t.incomeByType[r.type] = (t.incomeByType[r.type] || 0) + v;
    }
    for (const r of d.expenses) {
      if (!r.date) continue;
      const v = FX.toARS(r.amount, r.currency, r.date);
      const t = g(r.date.slice(0, 7));
      t.expenses += v; t.count++;
      t[r.kind === 'fijo' ? 'fixed' : r.kind === 'extraordinario' ? 'extra' : 'variable'] += v;
      t.byCat[r.categoryId] = (t.byCat[r.categoryId] || 0) + v;
    }
    for (const r of d.investments) {
      if (!r.date) continue;
      g(r.date.slice(0, 7)).investment += FX.toARS(r.amountInvested, r.currency, r.date);
    }
    // Inflación: demo primero, los datos reales sobreescriben
    const infl = {};
    [...d.inflation].sort((a, b) => (a.demo === b.demo ? 0 : a.demo ? -1 : 1)).forEach(r => { infl[r.month] = r; });
    const keys = Object.keys(months).filter(k => months[k].count > 0 || months[k].investment > 0).sort();
    return (this._c = { months, keys, infl });
  },
  month(ym) { return this.cache().months[ym] || emptyMonth(); },
  hasData(ym) { const m = this.cache().months[ym]; return !!(m && m.count); },
  firstMonth() { return this.cache().keys[0] || null; },
  lastMonth() { const k = this.cache().keys; return k.length ? k[k.length - 1] : null; },
  range(end, n) {
    if (n === 'all') { const f = this.firstMonth(); return f && f <= end ? U.monthsBetween(f, end) : [end]; }
    return U.monthsBetween(U.addMonths(end, -(n - 1)), end);
  },
  savingsRate(ym) { const t = this.month(ym); return t.income > 0 ? (t.income - t.expenses) / t.income * 100 : null; },
  avgExpenses(end, n) {
    const ms = U.monthsBetween(U.addMonths(end, -(n - 1)), end).filter(m => this.hasData(m));
    return U.avg(ms.map(m => this.month(m).expenses));
  },
  /* Inflación */
  inflMap() { const o = {}; const c = this.cache().infl; for (const k in c) o[k] = c[k].value; return o; },
  inflationList() { return Object.values(this.cache().infl).sort((a, b) => (a.month < b.month ? 1 : -1)); },
  lastInflationMonth() { const l = this.inflationList(); return l.length ? l[0].month : null; },
  /** Factor acumulado de precios entre el cierre de `from` y el cierre de `to`: Π(1 + π_k) para k en (from, to] */
  cumInflation(from, to) {
    if (!from || !to || to <= from) return { factor: 1, missing: 0, months: 0 };
    const map = this.inflMap();
    let factor = 1, missing = 0, months = 0;
    for (let ym = U.addMonths(from, 1); ym <= to; ym = U.addMonths(ym, 1)) {
      months++;
      const v = map[ym];
      if (v == null) missing++; else factor *= 1 + v / 100;
    }
    return { factor, missing, months };
  },
  ytd(ym) { const r = this.cumInflation(`${+ym.slice(0, 4) - 1}-12`, ym); return { value: (r.factor - 1) * 100, missing: r.missing }; },
  yoy(ym) { const r = this.cumInflation(U.addMonths(ym, -12), ym); return r.missing ? null : (r.factor - 1) * 100; },
  /** Variación real = (1 + nominal) / (1 + inflación) − 1 */
  realChange(nominalPct, inflPct) {
    if (nominalPct == null || inflPct == null) return null;
    return ((1 + nominalPct / 100) / (1 + inflPct / 100) - 1) * 100;
  },
  /** Proyección de cierre: fijos completos + variables extrapolados por día transcurrido */
  projection(ym) {
    if (ym !== U.thisMonth()) return null;
    const t = this.month(ym);
    const day = new Date().getDate(), dim = U.daysInMonth(ym);
    if (!t.expenses || day >= dim) return null;
    return { value: t.fixed + t.extra + t.variable / day * dim, day, dim };
  },
  /* Patrimonio */
  patrimonyNow() {
    const d = Store.data, today = U.today();
    let assets = 0, liquid = 0, investments = 0;
    for (const a of d.assets) {
      const v = FX.toARS(a.value, a.currency, today);
      assets += v;
      if ((ASSET_TYPES.find(t => t.id === a.type) || {}).liquid) liquid += v;
    }
    for (const r of d.investments) {
      const v = FX.toARS(r.currentValue ?? r.amountInvested, r.currency, today);
      investments += v;
      if (LIQUID_INVESTMENTS.includes(r.type)) liquid += v;
    }
    const liabilities = U.sum(d.liabilities, l => FX.toARS(l.amount, l.currency, today));
    return { assets, investments, liabilities, liquid, total: assets + investments - liabilities };
  },
  snapshots() { return [...Store.data.monthlySnapshots].sort((a, b) => (a.month < b.month ? -1 : 1)); },
  snapshotMap() { const o = {}; this.snapshots().forEach(s => { o[s.month] = s; }); return o; },
  portfolio() {
    const today = U.today(), lastInf = this.lastInflationMonth(), rNow = FX.rateOn(today);
    let invested = 0, current = 0, investedUSD = 0, currentUSD = 0, investedAdj = 0;
    const byType = {};
    for (const r of Store.data.investments) {
      const inv = FX.toARS(r.amountInvested, r.currency, r.date);
      const curNative = r.currentValue ?? r.amountInvested;
      const cur = FX.toARS(curNative, r.currency, today);
      invested += inv; current += cur;
      byType[r.type] = (byType[r.type] || 0) + cur;
      const rDate = FX.rateOn(r.date);
      investedUSD += r.currency === 'USD' ? +r.amountInvested : (rDate ? inv / rDate : 0);
      currentUSD += r.currency === 'USD' ? +curNative : (rNow ? cur / rNow : 0);
      const m = r.date.slice(0, 7);
      investedAdj += inv * (lastInf && m < lastInf ? this.cumInflation(m, lastInf).factor : 1);
    }
    return {
      invested, current, gain: current - invested,
      gainPct: invested ? (current / invested - 1) * 100 : null,
      investedUSD, currentUSD, gainUSD: currentUSD - investedUSD,
      gainUSDPct: investedUSD ? (currentUSD / investedUSD - 1) * 100 : null,
      realPct: investedAdj ? (current / investedAdj - 1) * 100 : null,
      byType, lastInf
    };
  }
};

/* Detección de desvíos y conclusiones en lenguaje simple */
function buildInsights(ym) {
  const out = [], s = Store.data.settings, t = Finance.month(ym);
  if (!t.count) return out;
  const prevMonths = [1, 2, 3].map(i => U.addMonths(ym, -i)).filter(m => Finance.hasData(m));

  if (prevMonths.length >= 2) {
    const rows = [];
    for (const c of Store.data.categories) {
      const cur = t.byCat[c.id] || 0;
      const avg = U.avg(prevMonths.map(m => Finance.month(m).byCat[c.id] || 0));
      if (avg > 0 && cur > 0) {
        const ch = (cur / avg - 1) * 100;
        if (Math.abs(ch) >= 20 && Math.abs(cur - avg) > t.expenses * 0.015) rows.push({ c, ch, cur, avg });
      }
    }
    rows.sort((a, b) => Math.abs(b.ch) - Math.abs(a.ch)).slice(0, 3).forEach(r => out.push({
      level: r.ch > 0 ? 'warn' : 'good',
      text: `${r.c.name}: ${r.ch > 0 ? 'aumentó' : 'bajó'} ${U.pct(Math.abs(r.ch), 0)} respecto del promedio de los ${prevMonths.length} meses anteriores (${U.ars(r.cur)} contra ${U.ars(r.avg)}).`
    }));
  }

  if (t.extra > 0) {
    const pm = U.addMonths(ym, -1);
    let tail = '';
    if (Finance.hasData(pm)) {
      const p = Finance.month(pm);
      const ch = U.change(t.expenses - t.extra, p.expenses - p.extra);
      if (ch != null) tail = Math.abs(ch) < 3
        ? ' Sin ellos, el gasto fue similar al del mes anterior.'
        : ` Sin ellos, el gasto fue ${U.pct(Math.abs(ch), 1)} ${ch > 0 ? 'mayor' : 'menor'} que el del mes anterior.`;
    }
    out.push({ level: 'info', text: `Este mes hubo ${U.ars(t.extra)} de gastos extraordinarios.${tail}` });
  }

  if (t.income > 0) {
    const v = t.variable / t.income * 100;
    out.push({ level: v > 40 ? 'warn' : 'info', text: `Los gastos variables representan ${U.pct(v, 0)} de los ingresos del mes.` });
    const sr = Finance.savingsRate(ym);
    if (sr >= s.savingsGoal) out.push({ level: 'good', text: `La tasa de ahorro (${U.pct(sr, 1)}) alcanza la meta de ${s.savingsGoal} %.` });
    else if (sr >= 0) out.push({ level: 'warn', text: `La tasa de ahorro (${U.pct(sr, 1)}) está por debajo de la meta de ${s.savingsGoal} %.` });
    else out.push({ level: 'bad', text: `Los gastos superaron a los ingresos por ${U.ars(t.expenses - t.income)}.` });
  }

  const base = U.addMonths(ym, -3);
  if (Finance.hasData(base)) {
    const b = Finance.month(base);
    const g = U.change(t.expenses - t.extra, b.expenses - b.extra);
    const inf = Finance.cumInflation(base, ym);
    if (g != null && inf.missing < inf.months) {
      const ip = (inf.factor - 1) * 100, real = Finance.realChange(g, ip);
      out.push({
        level: real > 3 ? 'warn' : 'good',
        text: `En tres meses el gasto sin extraordinarios varió ${U.pct(g, 1, true)} y la inflación fue ${U.pct(ip, 1)}: en términos reales ${real > 0 ? 'subió' : 'bajó'} ${U.pct(Math.abs(real), 1)}.${inf.missing ? ' Falta el dato de inflación de algún mes; se tomó como 0 %.' : ''}`
      });
    }
  }

  const avg3 = Finance.avgExpenses(ym, 3), p = Finance.patrimonyNow();
  if (avg3 > 0 && p.liquid > 0) {
    const cov = p.liquid / avg3;
    out.push({
      level: cov >= s.emergencyMonths ? 'good' : cov >= 3 ? 'warn' : 'bad',
      text: `Los activos líquidos cubren ${U.nf1.format(cov)} meses de gastos promedio (la meta es ${s.emergencyMonths}).`
    });
  }
  return out;
}

const Charts = {
  inst: {},
  ok() { return typeof window.Chart !== 'undefined'; },
  colors() {
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    return { ink: v('--ink'), ink2: v('--ink-2'), ink3: v('--ink-3'), line: v('--line'), celeste: v('--celeste'), good: v('--good'), warn: v('--warn'), bad: v('--bad'), violet: v('--violet'), surface: v('--surface') };
  },
  destroyAll() { Object.values(this.inst).forEach(c => { try { c.destroy(); } catch (e) { /* ya destruido */ } }); this.inst = {}; },
  make(id, config) {
    const el = document.getElementById(id);
    if (!el) return;
    if (!this.ok()) { el.parentElement.innerHTML = '<div class="chart-fallback">Los gráficos necesitan conexión a internet la primera vez que se abre el archivo.</div>'; return; }
    if (this.inst[id]) this.inst[id].destroy();
    const c = this.colors();
    Chart.defaults.color = c.ink2;
    Chart.defaults.borderColor = c.line;
    Chart.defaults.font.family = "'Archivo', system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    this.inst[id] = new Chart(el, config);
  },
  fallback(id, msg) { const el = document.getElementById(id); if (el) el.parentElement.innerHTML = `<div class="chart-fallback">${U.esc(msg)}</div>`; },
  opts({ cur = 'ARS', stacked = false, pct = false, y2 = false, legend = true } = {}) {
    const c = this.colors();
    const fmt = v => pct ? U.nf1.format(v) + ' %' : (cur === 'USD' ? 'US$ ' : cur === 'IDX' ? '' : '$ ') + U.compact(v);
    const o = {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: legend, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 2 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              if (v == null) return `${ctx.dataset.label}: sin dato`;
              const isY2 = ctx.dataset.yAxisID === 'y2';
              const val = pct ? U.pct(v, 1) : cur === 'IDX' ? U.nf1.format(v) : U.money(v, isY2 ? 'USD' : cur);
              return `${ctx.dataset.label}: ${val}`;
            }
          }
        }
      },
      scales: {
        x: { stacked, grid: { display: false } },
        y: { stacked, grid: { color: c.line }, border: { display: false }, ticks: { callback: fmt } }
      }
    };
    if (y2) o.scales.y2 = { position: 'right', grid: { display: false }, border: { display: false }, ticks: { callback: v => 'US$ ' + U.compact(v) } };
    return o;
  }
};

const icon = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

function guilloche(n = 26, rx = 185, ry = 58) {
  let s = '';
  for (let i = 0; i < n; i++) s += `<ellipse cx="200" cy="200" rx="${rx}" ry="${ry}" transform="rotate(${(180 / n) * i} 200 200)"/>`;
  return `<svg class="guilloche" viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width=".7" aria-hidden="true">${s}<circle cx="200" cy="200" r="60"/><circle cx="200" cy="200" r="64"/></svg>`;
}

/** Badge de tendencia. goodWhen: 'up' si subir es favorable; 'down' si bajar es favorable. */
function trendBadge(ch, goodWhen = 'up', levelOverride = null) {
  if (ch == null) return '<span class="badge neutral">sin dato previo</span>';
  const better = goodWhen === 'up' ? ch >= 0 : ch <= 0;
  const level = levelOverride || (better ? 'good' : Math.abs(ch) <= 5 ? 'warn' : 'bad');
  const ic = ch > 0.05 ? 'up' : ch < -0.05 ? 'down' : 'flat';
  return `<span class="badge ${level}" title="${U.cap(LEVEL_WORD[level])}">${icon(ic, 13)}${U.pct(ch, 1, true)}<span class="sr-only"> (${LEVEL_WORD[level]})</span></span>`;
}

const Modal = {
  lastFocus: null,
  open({ title, body, footer = '', narrow = false, onMount }) {

    const root = $('#modalRoot');

        <div class="modal-body">${body}</div>
        ${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}
      </div>`;
    root.classList.add('open');
    root.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', () => this.close()));
    if (onMount) onMount(root);
    const first = root.querySelector('.modal-body input:not([type=hidden]), .modal-body select, .modal-body textarea, .modal-foot button');
    (first || root.querySelector('.modal')).focus();
  },

function fieldHTML(f, value) {
  const id = 'f_' + f.name;
  const req = f.required ? 'required' : '';
  const v = value ?? f.default ?? '';
  let input;
  if (f.type === 'select') input = `<select id="${id}" name="${f.name}" ${req}>${f.placeholder ? `<option value="">${U.esc(f.placeholder)}</option>` : ''}${H.options(f.options || [], v)}</select>`;
  else if (f.type === 'textarea') input = `<textarea id="${id}" name="${f.name}" rows="2" placeholder="${U.esc(f.placeholder || '')}">${U.esc(v)}</textarea>`;
  else input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${U.esc(v)}" ${req} ${f.step ? `step="${f.step}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} placeholder="${U.esc(f.placeholder || '')}" ${f.type === 'number' ? 'inputmode="decimal"' : ''}>`;
  return `<div class="field ${f.full ? 'full' : ''}"><label for="${id}">${f.label}${f.required ? '' : ' <span class="muted">(opcional)</span>'}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
}

function formModal({ title, fields, values = {}, submitLabel = 'Guardar', onSubmit, onMount }) {
  const body = `<form id="mForm" class="form-grid" novalidate>${fields.map(f => fieldHTML(f, values[f.name])).join('')}<div class="form-error" id="mErr" role="alert"></div></form>`;
  Modal.open({
    title, body,
    footer: `<button type="button" class="btn" data-modal-close>Cancelar</button><button type="submit" form="mForm" class="btn primary">${submitLabel}</button>`,
    onMount(root) {
      root.querySelectorAll('.modal-foot [data-modal-close]').forEach(b => b.addEventListener('click', () => Modal.close()));
      const form = root.querySelector('#mForm');
      form.addEventListener('submit', e => {
        e.preventDefault();
        const vals = {};
        for (const f of fields) {
          const el = form.elements[f.name];
          if (!el) continue;
          const raw = el.value.trim();
          vals[f.name] = f.type === 'number' ? (raw === '' ? null : parseFloat(raw.replace(',', '.'))) : raw;
        }
        const err = validate(fields, vals);
        if (err) { root.querySelector('#mErr').textContent = err; return; }
        try { if (onSubmit(vals) !== false) Modal.close(); }
        catch (ex) { root.querySelector('#mErr').textContent = ex.message; }
      });
      if (onMount) onMount(form);
    }
  });
}

function validate(fields, vals) {
  for (const f of fields) {
    const v = vals[f.name];
    if (f.required && (v === '' || v == null)) return `Completá el campo "${f.label}".`;
    if (f.type === 'number' && v != null) {
      if (!isFinite(v)) return `"${f.label}" tiene que ser un número.`;
      if (f.min != null && v < f.min) return `"${f.label}" tiene que ser mayor o igual a ${f.min}.`;
    }
    if (f.type === 'date' && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return `Revisá la fecha en "${f.label}".`;
  }
  return null;
}

function toast(msg, type = 'info') {
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `${icon(type === 'error' ? 'xcircle' : type === 'good' ? 'check' : 'info', 16)}<span>${U.esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

function pickFile(accept) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept;
    inp.addEventListener('change', () => res(inp.files[0] || null));
    inp.click();
  });
}

const CSV = {
  cell(v) { const s = v == null ? '' : String(v); return /[;"\n\r,]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; },
  parse(text) {
    text = text.replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); rows.push(row); row = []; cur = '';
      } else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  },
  amount(s) {
    s = String(s || '').trim().replace(/[^\d,.\-]/g, '');
    if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    else if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(',', '.');
    return parseFloat(s);
  }
};

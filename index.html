  exportCSV() {
    const head = ['tipo','fecha','persona','categoria','subcategoria','descripcion','monto','moneda','medio_pago','tipo_gasto','notas'];
    const rows = [head];
    const n = v => String(v ?? '').replace('.', ',');
    Store.data.income.forEach(r => rows.push(['ingreso', r.date, personLabel(r.person), r.type, '', r.description, n(r.amount), r.currency, '', r.recurrence, r.notes]));
    Store.data.expenses.forEach(r => rows.push(['gasto', r.date, personLabel(r.person), catName(r.categoryId), r.subcategory, r.description, n(r.amount), r.currency, r.paymentMethod, r.kind, r.notes]));
    rows.sort((a, b) => (a[1] < b[1] ? -1 : 1));
    U.download(`movimientos-${U.today()}.csv`, '\uFEFF' + rows.map(r => r.map(CSV.cell).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
    toast(`Se exportaron ${rows.length - 1} movimientos`, 'good');
  },
  async importCSV() {
    const f = await pickFile('.csv,text/csv');
    if (!f) return;
    const rows = CSV.parse(await U.readFile(f));
    if (rows.length < 2) { toast('El CSV está vacío.', 'error'); return; }
    const head = rows[0].map(h => h.trim().toLowerCase());
    const col = name => head.indexOf(name);
    if (col('fecha') < 0 || col('monto') < 0) { toast('El CSV necesita al menos las columnas "fecha" y "monto". Usá el formato de la exportación.', 'error'); return; }
    const s = Store.data.settings;
    const personId = name => {
      const x = String(name || '').trim().toLowerCase();
      if (x === (s.members[0] || '').toLowerCase()) return 'p1';
      if (x === (s.members[1] || '').toLowerCase()) return 'p2';
      if (x.startsWith('otro')) return 'other';
      return 'shared';
    };
    let added = 0, skipped = 0;
    for (const r of rows.slice(1)) {
      const g = name => (col(name) >= 0 ? (r[col(name)] || '').trim() : '');
      const date = U.parseDate(g('fecha')), amount = CSV.amount(g('monto'));
      if (!date || !(amount > 0)) { skipped++; continue; }
      const currency = g('moneda').toUpperCase() === 'USD' ? 'USD' : 'ARS';
      if (g('tipo').toLowerCase().startsWith('ingreso')) {
        Store.add('income', { date, amount, currency, person: personId(g('persona')), type: INCOME_TYPES.includes(g('categoria')) ? g('categoria') : 'Otros', description: g('descripcion'), recurrence: g('tipo_gasto') === 'extraordinario' ? 'extraordinario' : 'recurrente', notes: g('notas') }, false);
      } else {
        const cname = g('categoria') || 'Otros';
        let cat = Store.data.categories.find(c => c.name.toLowerCase() === cname.toLowerCase());
        if (!cat) { cat = { id: U.uid(), name: cname, subs: [], color: CAT_COLORS[Store.data.categories.length % CAT_COLORS.length] }; Store.data.categories.push(cat); }
        const sub = g('subcategoria');
        if (sub && !cat.subs.includes(sub)) cat.subs.push(sub);
        const kind = ['fijo', 'variable', 'extraordinario'].includes(g('tipo_gasto').toLowerCase()) ? g('tipo_gasto').toLowerCase() : 'variable';
        Store.add('expenses', { date, amount, currency, person: personId(g('persona')), categoryId: cat.id, subcategory: sub, description: g('descripcion'), paymentMethod: PAY_METHODS.includes(g('medio_pago')) ? g('medio_pago') : 'Otro', kind, notes: g('notas') }, false);
      }
      added++;
    }
    Store.save();
    toast(`Se importaron ${added} movimientos${skipped ? `; ${skipped} filas se omitieron por fecha o monto inválidos` : ''}.`, added ? 'good' : 'error');
    render();
  },
  async importInflationCSV() {
    const f = await pickFile('.csv,text/csv');
    if (!f) return;
    const rows = CSV.parse(await U.readFile(f));
    const list = [];
    for (const r of rows) {
      const m = String(r[0] || '').trim().match(/^(\d{4})-(\d{1,2})/) || String(r[0] || '').trim().match(/^(\d{1,2})\/(\d{4})$/);
      if (!m) continue;
      const month = m[0].includes('/') ? `${m[2]}-${pad(m[1])}` : `${m[1]}-${pad(m[2])}`;
      const value = CSV.amount(r[1]);
      if (isFinite(value)) list.push({ month, value, source: (r[2] || 'Importación CSV').trim() });
    }
    if (!list.length) { toast('No se encontraron filas válidas. Formato esperado: mes;valor (por ejemplo 2026-09;2,1).', 'error'); return; }
    InflationService.upsert(list);
    toast(`Se importaron ${list.length} meses de inflación`, 'good');
    render();
  }
};

/* =====================================================================
   10. DATOS DE DEMOSTRACIÓN (12 meses, Argentina)
   ===================================================================== */
const Demo = {
  has() { return COLLECTIONS.some(c => Store.data[c].some(r => r.demo)); },
  clear() { COLLECTIONS.forEach(c => { Store.data[c] = Store.data[c].filter(r => !r.demo); }); Store.save(); },
  generate() {
    COLLECTIONS.forEach(c => { Store.data[c] = Store.data[c].filter(r => !r.demo); });
    const d = Store.data, rnd = U.rng(20261003), today = U.today(), end = U.thisMonth(), todayDay = +today.slice(8);
    const months = U.monthsBetween(U.addMonths(end, -11), end);
    const add = (c, r) => d[c].push({ id: U.uid(), createdAt: new Date().toISOString(), demo: true, ...r });

    // Inflación (23 meses publicados; el mes en curso todavía no tiene dato)
    const realInfl = new Set(d.inflation.map(r => r.month));
    const inflByMonth = {};
    U.monthsBetween(U.addMonths(end, -23), U.addMonths(end, -1)).forEach((m, i) => {
      const value = +(3.6 - i * 0.065 + (rnd() - 0.5) * 0.6).toFixed(1);
      inflByMonth[m] = value;
      if (!realInfl.has(m)) add('inflation', { month: m, value, source: 'Dato de demostración' });
    });
    const pf = [1];
    for (let i = 1; i < months.length; i++) pf[i] = pf[i - 1] * (1 + (inflByMonth[months[i]] ?? 2) / 100);
    const pfEnd = pf[pf.length - 1];

    // Cotizaciones diarias de los últimos 365 días
    const realRates = new Set(d.exchangeRates.map(r => r.type + '|' + r.date));
    let of = 1180;
    for (let k = 365; k >= 0; k--) {
      const date = U.addDays(today, -k);
      of = of * (1 + 0.00055 + (rnd() - 0.5) * 0.004);
      const mep = of * (1.035 + (rnd() - 0.5) * 0.012), blue = of * (1.045 + (rnd() - 0.5) * 0.015), ccl = mep * (1.012 + (rnd() - 0.5) * 0.006);
      [['oficial', of, 0.96], ['mep', mep, 0.99], ['blue', blue, 0.985], ['ccl', ccl, 0.99]].forEach(([type, sell, spr]) => {
        if (!realRates.has(type + '|' + date)) add('exchangeRates', { date, type, sell: U.round(sell, 0.5), buy: U.round(sell * spr, 0.5), source: 'Dato de demostración' });
      });
    }
    FX.invalidate();

    // Categorías necesarias
    const cat = name => {
      let c = d.categories.find(x => x.name === name);
      if (!c) { c = { id: U.uid(), name, subs: [], color: CAT_COLORS[d.categories.length % CAT_COLORS.length] }; d.categories.push(c); }
      return c;
    };
    const ensureSub = (c, s) => { if (s && !c.subs.includes(s)) c.subs.push(s); };

    const items = [
      ['Vivienda', 'Alquiler / Hipoteca', 'Cuota crédito casa', 520000, 'fijo', 'Débito', 10, 'shared', { noise: 0.004 }],
      ['Servicios', 'Luz', 'EPEC', 46000, 'fijo', 'Débito', 12, 'shared', { season: { '01': 1.45, '02': 1.35, '07': 1.25 } }],
      ['Servicios', 'Gas', 'Ecogas', 13000, 'fijo', 'Débito', 14, 'shared', { season: { '06': 2.6, '07': 2.9, '08': 2.3 } }],
      ['Servicios', 'Agua', 'Aguas Cordobesas', 11000, 'fijo', 'Débito', 15, 'shared'],
      ['Servicios', 'Internet', 'Internet hogar', 34000, 'fijo', 'Débito', 8, 'shared'],
      ['Servicios', 'Celular', 'Claro (2 líneas)', 37000, 'fijo', 'Crédito', 8, 'shared'],
      ['Servicios', 'Streaming', 'Spotify y Netflix', 19000, 'fijo', 'Crédito', 4, 'shared'],
      ['Alimentación', 'Supermercado', 'Supermercado', 165000, 'variable', 'Crédito', null, 'shared', { splits: 3, growth: 0.009 }],
      ['Alimentación', 'Verdulería', 'Verdulería', 33000, 'variable', 'Efectivo', null, 'p2', { splits: 2 }],
      ['Alimentación', 'Carnicería', 'Carnicería', 55000, 'variable', 'Débito', null, 'p1', { splits: 2 }],
      ['Alimentación', 'Dietética', 'Dietética', 22000, 'variable', 'Mercado Pago', null, 'p2'],
      ['Alimentación', 'Delivery', 'PedidosYa', 27000, 'variable', 'Mercado Pago', null, 'shared', { splits: 2, growth: 0.035 }],
      ['Alimentación', 'Restaurantes', 'Salida a comer', 75000, 'variable', 'Crédito', null, 'shared'],
      ['Transporte', 'Combustible', 'Nafta', 80000, 'variable', 'Crédito', null, 'p1', { splits: 2 }],
      ['Transporte', 'Seguro', 'Seguro auto', 82000, 'fijo', 'Débito', 5, 'shared'],
      ['Transporte', 'Patente', 'Patente', 28000, 'fijo', 'Débito', 20, 'shared'],
      ['Salud', 'Obra social', 'Prepaga', 290000, 'fijo', 'Débito', 3, 'shared'],
      ['Salud', 'Medicamentos', 'Farmacia', 38000, 'variable', 'Débito', null, 'shared'],
      ['Educación', 'Idiomas', 'Inglés', 92000, 'fijo', 'Transferencia', 10, 'p2'],
      ['Gimnasio / deporte', 'Club', 'Club Banco', 100000, 'fijo', 'Débito', 10, 'shared'],
      ['Gimnasio / deporte', 'Rugby', 'Rugby', 30000, 'fijo', 'Efectivo', 10, 'p1'],
      ['Ocio', 'Salidas', 'Cine y salidas', 60000, 'variable', 'Crédito', null, 'shared', { chance: 0.85 }],
      ['Impuestos', 'Monotributo', 'Monotributo', 60000, 'fijo', 'Débito', 20, 'p1'],
      ['Impuestos', 'Impuesto municipal', 'Tasa municipal', 15000, 'fijo', 'Débito', 18, 'shared'],
      ['Mascotas', 'Alimento', 'Alimento para el perro', 42000, 'variable', 'Débito', null, 'shared'],
      ['Ropa', 'Indumentaria', 'Ropa', 120000, 'variable', 'Crédito', null, 'shared', { chance: 0.5 }]
    ];

    months.forEach((m, i) => {
      const mm = m.slice(5), dim = U.daysInMonth(m), isCurrent = m === end;
      const okDay = day => !isCurrent || day <= todayDay;
      const pfStep = pf[i - (i % 3)];

      // Ingresos (paritarias trimestrales que corren apenas detrás de la inflación)
      const sal1 = U.round(1900000 * (1 + (pfStep - 1) * 0.9), 1000), sal2 = U.round(1250000 * (1 + (pfStep - 1)), 1000);
      add('income', { date: `${m}-01`, person: 'p1', type: 'Sueldo', description: 'Sueldo', amount: sal1, currency: 'ARS', recurrence: 'recurrente' });
      add('income', { date: `${m}-01`, person: 'p2', type: 'Sueldo', description: 'Sueldo', amount: sal2, currency: 'ARS', recurrence: 'recurrente' });
      if ((mm === '06' || mm === '12') && okDay(20)) {
        add('income', { date: `${m}-20`, person: 'p1', type: 'Bono', description: 'Aguinaldo', amount: U.round(sal1 / 2, 1000), currency: 'ARS', recurrence: 'extraordinario' });
        add('income', { date: `${m}-20`, person: 'p2', type: 'Bono', description: 'Aguinaldo', amount: U.round(sal2 / 2, 1000), currency: 'ARS', recurrence: 'extraordinario' });
      }
      if (rnd() < 0.45 && okDay(18)) add('income', { date: `${m}-18`, person: 'p2', type: 'Emprendimiento', description: 'Ventas del emprendimiento', amount: U.round((150000 + rnd() * 300000) * pf[i], 1000), currency: 'ARS', recurrence: 'extraordinario' });
      if (i % 2 === 0 && okDay(25)) add('income', { date: `${m}-25`, person: 'p1', type: 'Venta', description: 'Trabajo freelance', amount: U.round(300 + rnd() * 200, 10), currency: 'USD', recurrence: 'extraordinario' });
      if (okDay(28)) add('income', { date: `${m}-28`, person: 'shared', type: 'Intereses', description: 'Rendimiento cuenta remunerada', amount: U.round((30000 + rnd() * 25000) * pf[i], 100), currency: 'ARS', recurrence: 'recurrente' });

      // Gastos
      for (const [cname, sub, desc, base, kind, method, day, person, o = {}] of items) {
        if (o.chance && rnd() > o.chance) continue;
        const c = cat(cname); ensureSub(c, sub);
        const noise = o.noise ?? (kind === 'fijo' ? 0.02 : 0.14);
        const splits = o.splits || 1;
        for (let k = 0; k < splits; k++) {
          const dd = day || Math.min(dim, 1 + Math.floor(rnd() * dim));
          if (!okDay(dd)) continue;
          const amount = U.round(base * pf[i] * (1 + (o.growth || 0) * i) * (o.season && o.season[mm] || 1) * (1 + (rnd() - 0.5) * 2 * noise), 100);
          add('expenses', { date: `${m}-${pad(dd)}`, person, categoryId: c.id, subcategory: sub, description: desc, amount, currency: 'ARS', paymentMethod: method, kind });
        }
      }
      const extra = (cname, sub, desc, amount, day, method = 'Crédito') => {
        if (!okDay(day)) return;
        const c = cat(cname); ensureSub(c, sub);
        add('expenses', { date: `${m}-${pad(day)}`, person: 'shared', categoryId: c.id, subcategory: sub, description: desc, amount: U.round(amount, 100), currency: 'ARS', paymentMethod: method, kind: 'extraordinario' });
      };
      if (mm === '12') extra('Regalos', 'Fiestas', 'Regalos de fin de año', 280000 * pf[i], 21);
      if (mm === '01') extra('Vacaciones', 'Alojamiento', 'Vacaciones en la costa', 1300000 * pf[i], 12);
      if (i === 7) extra('Compras extraordinarias', 'Electrodomésticos', 'Lavarropas', 950000 * pf[i], 9);
      if (i === 4) extra('Transporte', 'Mantenimiento vehículo', 'Service y cubiertas', 380000 * pf[i], 16, 'Débito');

      // Inversiones: compra mensual de dólares MEP y CEDEARs cada tres meses
      if (okDay(10)) {
        const mepRate = FX.rateOn(`${m}-10`, 'mep') || 1300;
        add('investments', { type: 'Dólares', asset: 'Dólar MEP', ticker: 'USD', broker: 'Banco', date: `${m}-10`, currency: 'USD', quantity: 300, buyPrice: mepRate, amountInvested: 300, currentValue: 300 });
        if (i % 3 === 0) {
          const inv = U.round(450000 * pf[i], 1000);
          add('investments', { type: 'CEDEARs', asset: 'SPDR S&P 500', ticker: 'SPY', broker: 'IOL', date: `${m}-10`, currency: 'ARS', amountInvested: inv, currentValue: U.round(inv * (pfEnd / pf[i]) * (1 + 0.07 * (11 - i) / 12), 1000) });
        }
      }
    });
    add('investments', { type: 'Money Market', asset: 'FCI Money Market', ticker: '', broker: 'Mercado Pago', date: `${months[0]}-05`, currency: 'ARS', amountInvested: 1500000, currentValue: U.round(1500000 * pfEnd * 0.985, 1000) });
    add('investments', { type: 'Plazo fijo', asset: 'Plazo fijo UVA', ticker: '', broker: 'Banco Galicia', date: `${months[8]}-03`, currency: 'ARS', amountInvested: 1000000, currentValue: 1068000 });
    add('investments', { type: 'Criptomonedas', asset: 'Bitcoin', ticker: 'BTC', broker: 'Exchange', date: `${months[2]}-15`, currency: 'USD', quantity: 0.0025, amountInvested: 250, currentValue: 292 });

    // Activos y deudas
    add('assets', { type: 'banco', name: 'Caja de ahorro', value: 1450000, currency: 'ARS' });
    add('assets', { type: 'billetera', name: 'Mercado Pago', value: 380000, currency: 'ARS' });
    add('assets', { type: 'efectivo', name: 'Efectivo en casa', value: 120000, currency: 'ARS' });
    add('assets', { type: 'dolares', name: 'Dólares guardados', value: 2000, currency: 'USD' });
    add('assets', { type: 'vehiculo', name: 'Renault Clio', value: 13500000, currency: 'ARS' });
    add('assets', { type: 'propiedad', name: 'Casa', value: 78000, currency: 'USD' });
    add('liabilities', { name: 'Crédito hipotecario', amount: 31000000, currency: 'ARS' });
    add('liabilities', { name: 'Préstamo refacción baño', amount: 380000, currency: 'ARS' });

    // Cierres mensuales de patrimonio (reconstrucción aproximada)
    Store.data.monthlySnapshots = Store.data.monthlySnapshots.filter(s => !months.includes(s.month) || !s.demo);
    const realSnaps = new Set(Store.data.monthlySnapshots.map(s => s.month));
    months.forEach((m, i) => {
      if (realSnaps.has(m)) return;
      const mEnd = `${m}-${pad(U.daysInMonth(m))}`, rate = FX.monthRate(m, 'mep') || 1300, k = pf[i] / pfEnd;
      const assets = (1450000 + 380000 + 120000) * k * (0.8 + 0.2 * i / 11) + 13500000 * k + (2000 + 78000) * rate;
      let investments = 0;
      for (const r of d.investments) if (r.demo && r.date <= mEnd) investments += r.currency === 'USD' ? r.amountInvested * rate : r.amountInvested * (1 + (r.currentValue / r.amountInvested - 1) * (i / 11));
      const liabilities = (31000000 * (1 + 0.006 * (11 - i)) + 380000 * (1 + (11 - i) / 6)) * k;
      add('monthlySnapshots', { month: m, assets, investments, liabilities, total: assets + investments - liabilities });
    });

    Store.save();
  }
};

VIEWS.dashboard = {
  title: 'Dashboard',
  render() {

    const ym = state.month, s = Store.data.settings, t = Finance.month(ym);
    const prevM = U.addMonths(ym, -1), lyM = U.addMonths(ym, -12);
    const hasPrev = Finance.hasData(prevM), hasLy = Finance.hasData(lyM);
    const pT = Finance.month(prevM), lT = Finance.month(lyM);
    const bal = t.income - t.expenses, sr = Finance.savingsRate(ym), infl = Finance.inflMap()[ym];
    const chExp = hasPrev ? U.change(t.expenses, pT.expenses) : null;
    const chExpLy = hasLy ? U.change(t.expenses, lT.expenses) : null;
    const chInc = hasPrev ? U.change(t.income, pT.income) : null;
    let expLevel = null;
    if (chExp != null && infl != null) { const real = Finance.realChange(chExp, infl); expLevel = real <= 0 ? 'good' : real <= 3 ? 'warn' : 'bad'; }
    const pat = Finance.patrimonyNow();
    const prevSnap = Finance.snapshots().filter(x => x.month < ym).pop();
    const avg3 = Finance.avgExpenses(ym, 3), avg12 = Finance.avgExpenses(ym, 12);
    const proj = Finance.projection(ym);
    const avail = bal - t.investment;
    const label = U.monthLabel(ym);

    const hero = t.count
      ? `<p class="hero-line">${ym === U.thisMonth() ? `En lo que va de ${label}` : `En ${label}`} entraron <span class="fig">${U.ars(t.income)}</span>, salieron <span class="fig">${U.ars(t.expenses)}</span> y ${bal >= 0 ? 'quedaron' : 'faltaron'} <span class="fig">${U.ars(Math.abs(bal))}</span>.</p>

      ${cell('Balance (ahorro)', U.ars(bal), sr != null ? line(H.status(sr >= s.savingsGoal ? 'good' : sr >= 0 ? 'warn' : 'bad', `Ahorro ${U.pct(sr, 1)}`)) : '')}

      ${cell('Patrimonio total', U.ars(pat.total), prevSnap ? line(`${trendBadge(U.change(pat.total, prevSnap.total), 'up')} vs cierre ${U.monthLabel(prevSnap.month, true)}`) : line('Sin cierres anteriores'))}
      ${cell('Gasto promedio mensual', U.ars(avg3), line(`Últimos 3 meses`) + line(`12 meses: ${U.ars(avg12)}`))}

      <div class="row end" style="margin-top:10px">${H.btn(icon('download', 15) + 'Exportar CSV', 'export-csv', '', 'ghost small')}${H.btn(icon('upload', 15) + 'Importar CSV', 'import-csv', '', 'ghost small')}</div>`;

    bind('fCat', 'change', e => { f.cat = e.target.value; renderMovTable(); });

VIEWS.movimientos = movementsView;
VIEWS.ingresos = { ...movementsView, title: 'Ingresos' };
VIEWS.gastos = { ...movementsView, title: 'Gastos' };

function renderMovTable() {
  const box = document.getElementById('movTable');
  if (!box) return;
  const kind = movKind(), f = state.movFilters, ym = state.month, q = f.q.trim().toLowerCase();
  let rows = [];
  if (kind !== 'income') rows = rows.concat(Store.data.expenses.map(r => ({ ...r, _k: 'expense' })));
  if (kind !== 'expense' && !f.cat) rows = rows.concat(Store.data.income.map(r => ({ ...r, _k: 'income' })));
  rows = rows.filter(r => (f.allMonths || (r.date || '').startsWith(ym))
    && (!f.person || r.person === f.person)
    && (!f.cat || r.categoryId === f.cat)
    && (!q || (r.description || '').toLowerCase().includes(q) || (r.notes || '').toLowerCase().includes(q)))
    .sort((a, b) => (a.date === b.date ? (b.createdAt || '').localeCompare(a.createdAt || '') : a.date < b.date ? 1 : -1));
  const inc = U.sum(rows.filter(r => r._k === 'income'), r => FX.toARS(r.amount, r.currency, r.date));
  const exp = U.sum(rows.filter(r => r._k === 'expense'), r => FX.toARS(r.amount, r.currency, r.date));
  if (!rows.length) {
    box.innerHTML = `<div class="panel"><div class="empty"><p>No hay movimientos con estos filtros${f.allMonths ? '' : ` en ${U.monthLabel(ym)}`}.</p><div class="row">${kind !== 'income' ? H.btn(icon('plus', 16) + 'Agregar gasto', 'add-expense', '', 'primary') : ''}${kind !== 'expense' ? H.btn(icon('plus', 16) + 'Agregar ingreso', 'add-income') : ''}</div></div></div>`;
    return;
  }
  const LIMIT = 500, shown = rows.slice(0, LIMIT);
  const kindLbl = k => (EXPENSE_KINDS.find(x => x.id === k) || {}).label || 'Variable';
  box.innerHTML = `<div class="table-wrap"><table class="data">
    <thead><tr><th>Fecha</th><th>Descripción</th><th>Persona</th><th>Medio / tipo</th><th class="n">Monto</th><th><span class="sr-only">Acciones</span></th></tr></thead>
    <tbody>${shown.map(r => {
      const isInc = r._k === 'income';
      const meta = isInc ? U.esc(r.type || 'Ingreso') : `${U.esc(catName(r.categoryId))}${r.subcategory ? ' › ' + U.esc(r.subcategory) : ''}${r.installmentNo ? ` (cuota ${r.installmentNo} de ${r.installments})` : ''}`;
      const ars = FX.toARS(r.amount, r.currency, r.date);
      return `<tr>
        <td class="nowrap num">${U.dateLabel(r.date)}</td>
        <td><div class="cell-main">${U.esc(r.description || (isInc ? r.type : catName(r.categoryId)))}</div><div class="cell-meta">${isInc ? 'Ingreso: ' : ''}${meta}</div></td>
        <td>${U.esc(personLabel(r.person))}</td>
        <td>${isInc ? (r.recurrence === 'extraordinario' ? 'Extraordinario' : 'Recurrente') : `${U.esc(r.paymentMethod || '')}<div class="cell-meta">${kindLbl(r.kind)}${r.card ? ', ' + U.esc(r.card) : ''}</div>`}</td>
        <td class="n ${isInc ? 'pos' : ''}">${isInc ? '+' : '−'} ${U.money(r.amount, r.currency).replace('−', '')}${r.currency === 'USD' ? `<div class="cell-meta">≈ ${U.ars(ars)}</div>` : ''}</td>
        <td class="actions">${H.iconBtn('edit', isInc ? 'edit-income' : 'edit-expense', r.id, 'Editar')}${H.iconBtn('trash', isInc ? 'del-income' : 'del-expense', r.id, 'Eliminar', 'del')}</td>
      </tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td colspan="4">${rows.length} movimientos${rows.length > LIMIT ? ` (se muestran ${LIMIT})` : ''}</td><td class="n">${kind !== 'expense' && !f.cat ? `<div class="pos">+ ${U.ars(inc)}</div>` : ''}${kind !== 'income' ? `<div>− ${U.ars(exp)}</div>` : ''}${kind === 'all' && !f.cat ? `<div>= ${U.ars(inc - exp)}</div>` : ''}</td><td></td></tr></tfoot>
  </table></div>`;
}

      ${cell('Inversión del mes', U.ars(t.investment), U.cap(U.monthLabel(state.month)))}
      ${cell('Posiciones', String(inv.length), `${new Set(inv.map(r => r.asset)).size} activos distintos`)}
      ${cell('Cotización usada', FX.latest(Store.data.settings.dollarType) ? U.ars(FX.latest(Store.data.settings.dollarType).sell) : '—', `Dólar ${dollarLabel(Store.data.settings.dollarType)}`)}
    </div>`;

      <tbody>${rows.map(r => {

        return `<tr>
          <td><div class="cell-main">${U.esc(r.asset)}${r.ticker ? ` <span class="muted">${U.esc(r.ticker)}</span>` : ''}</div><div class="cell-meta">${U.esc(r.type)}${r.broker ? ', ' + U.esc(r.broker) : ''}</div></td>
          <td class="nowrap num">${U.dateLabel(r.date)}</td>
          <td class="n">${r.quantity != null ? U.nf2.format(r.quantity) : '—'}</td>
          <td class="n">${U.money(r.amountInvested, r.currency)}</td>
          <td class="n">${U.money(cur, r.currency)}</td>
          <td class="n ${g > 0 ? 'pos' : g < 0 ? 'neg' : ''}">${g >= 0 ? '+' : '−'} ${U.money(Math.abs(g), r.currency)}<div class="cell-meta">${U.pct(gp, 1, true)}</div></td>
          <td class="actions">${H.iconBtn('plus', 'contrib-investment', r.id, 'Registrar aporte')}${H.iconBtn('edit', 'edit-investment', r.id, 'Editar o actualizar valor')}${H.iconBtn('trash', 'del-investment', r.id, 'Eliminar', 'del')}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`;
    return `${ledger}
      <div class="grid g-12">
        ${H.panel('Distribución del patrimonio invertido', H.chart('chPort', 240, 'Distribución por tipo de activo'), { sub: 'Incluye la liquidez de Patrimonio' })}

  mount() {
    if (!Store.data.investments.length) return;
    const c = Charts.colors(), p = Finance.portfolio();

    const today = U.today();
    for (const a of Store.data.assets) {
      const tp = ASSET_TYPES.find(x => x.id === a.type);

    });
    const months = Finance.range(state.month, state.range);
    Charts.make('chContrib', {
      type: 'bar',
      data: { labels: months.map(m => U.monthLabel(m, true)), datasets: [{ label: 'Invertido', data: months.map(m => Finance.month(m).investment), backgroundColor: c.violet, borderRadius: 3 }] },
      options: Charts.opts({ legend: false })
    });
  }
};

  render() {
    const s = Store.data.settings;
    const tools = `${H.btn(icon('refresh', 15) + 'Actualizar ahora', 'refresh-rates', '', 'primary small', 'id="btnRates"')}${H.btn(icon('download', 15) + 'Descargar histórico', 'download-rates', '', 'small', 'id="btnHist"')}${H.btn(icon('plus', 15) + 'Cargar a mano', 'add-rate', '', 'small')}`;
    if (!FX.hasRates()) return H.panel('Cotizaciones', `<div class="empty"><p>No hay cotizaciones guardadas. Actualizá desde la API o cargá una a mano. El histórico se guarda en este navegador para armar los gráficos aunque la API no responda.</p><div class="row">${tools}</div></div>`);
    const cards = DOLLAR_TYPES.map(t => {
      const l = FX.latest(t.id), p = FX.previous(t.id);
      if (!l) return `<div class="rate-card"><div class="name">${t.label}</div><div class="sell">—</div><div class="meta">Sin datos</div></div>`;
      const ch = p ? U.change(l.sell, p.sell) : null;
      return `<div class="rate-card"><div class="name">Dólar ${t.label}${s.dollarType === t.id ? ' <span class="badge info">en uso</span>' : ''}</div>
        <div class="sell">${U.ars(l.sell)}</div>
        <div class="meta"><span>Compra ${U.ars(l.buy)}</span><span class="line">${ch != null ? trendBadge(ch, 'down') + ' vs dato anterior' : 'Sin dato anterior'}</span><span>${U.dateLabel(l.date)}${l.demo ? ', demostración' : l.source ? ', ' + U.esc(l.source) : ''}</span></div></div>`;
    }).join('');
    const days = [30, 90, 180, 365];
    const seg = `<div class="seg" role="group" aria-label="Período">${days.map(d => `<button type="button" class="${state.dollarDays === d ? 'on' : ''}" aria-pressed="${state.dollarDays === d}" data-act="dollar-days" data-arg="${d}">${d === 30 ? '30 días' : d === 90 ? '90 días' : d === 180 ? '6 meses' : '1 año'}</button>`).join('')}</div>`;
    const gap = (() => { const o = FX.latest('oficial'), b = FX.latest('blue'), m = FX.latest('mep'); return o && b && m ? `Brecha con el oficial: blue ${U.pct((b.sell / o.sell - 1) * 100, 1)}, MEP ${U.pct((m.sell / o.sell - 1) * 100, 1)}.` : ''; })();
    return `<div class="rate-grid">${cards}</div>
      <div class="grid">${H.panel('Evolución (precio de venta)', H.chart('chUsd', 290, 'Evolución de las cotizaciones'), { tools: seg, sub: gap })}</div>
      <div class="grid">${H.panel('Fuentes y actualización', `<p>Cotización actual: ${U.esc(ExchangeRateProvider.get().name)}. Histórico: ArgentinaDatos. El proveedor se cambia desde Configuración sin afectar el resto de la aplicación.</p><p class="muted small">Las conversiones de movimientos en dólares usan el dólar ${dollarLabel(s.dollarType)} de la fecha de cada movimiento. Solo se consultan datos públicos; las cotizaciones se consultan desde tu dispositivo y no se envía ningún dato tuyo.</p>`, { tools })}</div>`;
  },
  mount() {
    if (!FX.hasRates()) return;
    const c = Charts.colors(), from = U.addDays(U.today(), -state.dollarDays);
    const colors = { oficial: c.celeste, blue: c.ink2, mep: c.good, ccl: c.violet };
    const dates = [...new Set(DOLLAR_TYPES.flatMap(t => FX.series(t.id).filter(r => r.date >= from).map(r => r.date)))].sort();
    if (!dates.length) { Charts.fallback('chUsd', 'No hay cotizaciones en este período. Descargá el histórico.'); return; }
    Charts.make('chUsd', {
      type: 'line',
      data: { labels: dates.map(U.dateLabel), datasets: DOLLAR_TYPES.map(t => {
        const m = new Map(FX.series(t.id).map(r => [r.date, r.sell]));
        return { label: t.label, data: dates.map(d => m.get(d) ?? null), borderColor: colors[t.id], backgroundColor: colors[t.id], pointRadius: 0, borderWidth: 2, tension: 0.2, spanGaps: true };
      }) },
      options: (() => { const o = Charts.opts(); o.scales.x.ticks = { maxTicksLimit: 8, autoSkip: true }; return o; })()
    });
  }
};

/* ---------- Análisis ---------- */
VIEWS.analisis = {
  title: 'Análisis',
  render() {
    if (!Finance.firstMonth()) return welcome();
    const tabs = [['resumen', 'Resumen del mes'], ['inflacion', 'Gastos e ingresos vs inflación'], ['usd', 'Finanzas en USD'], ['evolucion', 'Evolución mensual']];
    const head = `<div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button type="button" role="tab" aria-selected="${state.analysisTab === id}" class="${state.analysisTab === id ? 'on' : ''}" data-act="analysis-tab" data-arg="${id}">${l}</button>`).join('')}</div>`;
    return head + (AN[state.analysisTab] || AN.resumen).render();
  },
  mount() { if (Finance.firstMonth()) (AN[state.analysisTab] || AN.resumen).mount(); }
};

const AN = {
  resumen: {
    render() {
      const ym = state.month, cmp = state.compareMonth && state.compareMonth !== ym ? state.compareMonth : U.addMonths(ym, -1);
      const a = Finance.month(ym), b = Finance.month(cmp), infl = Finance.inflMap()[ym];
      const snap = Finance.snapshotMap()[ym];
      const patV = snap ? snap.total : (ym === U.thisMonth() ? Finance.patrimonyNow().total : null);
      const kv = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
      const summary = `<dl class="kv" style="grid-template-columns:auto auto;max-width:420px">
        ${kv('Ingresos', U.ars(a.income))}${kv('Gastos', U.ars(a.expenses))}${kv('Ahorro', U.ars(a.income - a.expenses))}
        ${kv('Ahorro %', U.pct(Finance.savingsRate(ym), 1))}${kv('Inversiones', U.ars(a.investment))}${kv('Patrimonio', patV != null ? U.ars(patV) : 'sin cierre')}
        ${kv('Inflación', infl != null ? U.pct(infl, 1) : 'sin publicar')}${kv('Variación de gastos', U.pct(U.change(a.expenses, Finance.month(U.addMonths(ym, -1)).expenses), 1, true))}
      </dl>`;
      const monthOpts = Finance.cache().keys.filter(m => m !== ym).slice().reverse();
      const row = (lbl, va, vb, fmt, goodWhen) => { const ch = U.change(va, vb); return `<tr><td>${lbl}</td><td class="n">${fmt(va)}</td><td class="n">${fmt(vb)}</td><td class="n">${ch != null ? trendBadge(ch, goodWhen) : '—'}</td></tr>`; };
      const cmpTable = `<div class="table-wrap"><table class="data"><thead><tr><th></th><th class="n">${U.cap(U.monthLabel(ym, true))}</th><th class="n">${U.cap(U.monthLabel(cmp, true))}</th><th class="n">Variación</th></tr></thead><tbody>
        ${row('Ingresos', a.income, b.income, U.ars, 'up')}${row('Gastos', a.expenses, b.expenses, U.ars, 'down')}${row('Ahorro', a.income - a.expenses, b.income - b.expenses, U.ars, 'up')}
        ${row('Gastos fijos', a.fixed, b.fixed, U.ars, 'down')}${row('Gastos variables', a.variable, b.variable, U.ars, 'down')}${row('Extraordinarios', a.extra, b.extra, U.ars, 'down')}${row('Inversión', a.investment, b.investment, U.ars, 'up')}
      </tbody></table></div>`;
      const ids = new Set([...Object.keys(a.byCat), ...Object.keys(b.byCat)]);
      const diffs = [...ids].map(id => ({ id, a: a.byCat[id] || 0, b: b.byCat[id] || 0 })).map(x => ({ ...x, d: x.a - x.b }));
      const up = diffs.filter(x => x.d > 0).sort((p, q) => q.d - p.d).slice(0, 5);
      const down = diffs.filter(x => x.d < 0).sort((p, q) => p.d - q.d).slice(0, 5);
      const li = x => `<li><span class="dot" style="background:${(catById(x.id) || {}).color || '#999'}"></span>${U.esc(catName(x.id))}<span class="amt">${x.d > 0 ? '+' : '−'} ${U.ars(Math.abs(x.d))}</span><span class="pc">${x.b ? U.pct((x.a / x.b - 1) * 100, 0, true) : 'nuevo'}</span></li>`;
      const subKey = r => `${r.categoryId}|${r.subcategory || ''}`;
      const prevKeys = new Set(Store.data.expenses.filter(r => r.date >= `${U.addMonths(ym, -3)}-01` && r.date < `${ym}-01`).map(subKey));
      const curExp = Store.data.expenses.filter(r => (r.date || '').startsWith(ym));
      const fresh = [...new Map(curExp.filter(r => !prevKeys.has(subKey(r))).map(r => [subKey(r), r])).values()];
      const extras = curExp.filter(r => r.kind === 'extraordinario');
      return `<div class="grid g-2" style="margin-top:0">
          ${H.panel(U.cap(U.monthLabel(ym)), summary, { sub: 'Resumen automático del mes' })}
          ${H.panel('Comparación entre meses', cmpTable, { tools: `<label class="sr-only" for="cmpSel">Comparar con</label><select id="cmpSel">${H.options(monthOpts.map(m => ({ value: m, label: 'vs ' + U.monthLabel(m) })), cmp)}</select>` })}
        </div>
        <div class="grid g-3">
          ${H.panel('Categorías que más aumentaron', up.length ? `<ul class="cat-legend">${up.map(li).join('')}</ul>` : '<p class="muted">Ninguna categoría aumentó.</p>', { sub: `Contra ${U.monthLabel(cmp)}` })}
          ${H.panel('Categorías que más bajaron', down.length ? `<ul class="cat-legend">${down.map(li).join('')}</ul>` : '<p class="muted">Ninguna categoría bajó.</p>', { sub: `Contra ${U.monthLabel(cmp)}` })}
          ${H.panel('Gastos nuevos y extraordinarios', `${fresh.length ? `<p class="small muted">Sin registros en los tres meses anteriores:</p><ul class="cat-legend">${fresh.slice(0, 6).map(r => `<li>${U.esc(catName(r.categoryId))}${r.subcategory ? ' › ' + U.esc(r.subcategory) : ''}</li>`).join('')}</ul>` : '<p class="muted small">No hubo gastos nuevos.</p>'}${extras.length ? `<p class="small muted" style="margin-top:12px">Extraordinarios:</p><ul class="cat-legend">${extras.map(r => `<li>${U.esc(r.description || catName(r.categoryId))}<span class="amt">${U.money(r.amount, r.currency)}</span></li>`).join('')}</ul>` : ''}`)}
        </div>`;
    },
    mount() {
      const sel = document.getElementById('cmpSel');
      if (sel) sel.addEventListener('change', e => { state.compareMonth = e.target.value; render(); });
    }
  },
  inflacion: {
    ctx() {
      const end = state.month, first = Finance.firstMonth();
      const months = first && first < end ? U.monthsBetween(first, end) : [end];
      const base = state.baseMonth && months.includes(state.baseMonth) && state.baseMonth < end ? state.baseMonth : (months.length > 12 ? months[months.length - 13] : months[0]);
      return { end, base, months, span: U.monthsBetween(base, end) };
    },
    render() {
      const { end, base, months } = this.ctx();
      if (base >= end) return H.notice('Se necesitan al menos dos meses con datos para comparar contra la inflación.');
      const ex = state.excludeExtra;
      const expOf = m => { const t = Finance.month(m); return ex ? t.expenses - t.extra : t.expenses; };
      const incOf = m => Finance.month(m).income;
      const inf = Finance.cumInflation(base, end), ip = (inf.factor - 1) * 100;
      const block = (name, v0, v1, goodWhen) => {
        const g = U.change(v1, v0);
        if (g == null) return `<p class="muted">Sin datos de ${name.toLowerCase()} en ${U.monthLabel(base)}.</p>`;
        const real = Finance.realChange(g, ip);
        const favorable = goodWhen === 'up' ? real >= 0 : real <= 0;
        const verdict = name === 'Gastos'
          ? (real > 0 ? `Los gastos crecieron ${U.pct(real, 1)} en términos reales.` : `Los gastos bajaron ${U.pct(-real, 1)} en términos reales.`)
          : (real >= 0 ? `El poder adquisitivo de los ingresos mejoró ${U.pct(real, 1)}.` : `El poder adquisitivo de los ingresos cayó ${U.pct(-real, 1)}.`);
        return `<div class="verdict">${H.status(favorable ? 'good' : 'bad', favorable ? 'Favorable' : 'Desfavorable')} ${verdict}</div>
          <div class="explain">
            <p>${name}: de ${U.ars(v0)} en ${U.monthLabel(base)} a ${U.ars(v1)} en ${U.monthLabel(end)}, una variación nominal de <strong>${U.pct(g, 1, true)}</strong>.</p>
            <p>Inflación acumulada entre esos meses: <strong>${U.pct(ip, 1)}</strong> (producto de ${inf.months} tasas mensuales).</p>
            <p class="formula">Variación real = (1 ${g >= 0 ? '+' : '−'} ${U.nf1.format(Math.abs(g) / 100 * 100)} %) ÷ (1 + ${U.nf1.format(ip)} %) − 1 = ${U.pct(real, 1, true)}</p>
            <p class="muted small" style="margin:0">${name === 'Gastos' ? 'Si el resultado es positivo, el consumo aumentó más allá de la suba de precios.' : 'Si el resultado es negativo, los ingresos compran menos que antes.'}</p>
          </div>`;
      };
      const opts = months.slice(0, -1).reverse().map(m => ({ value: m, label: U.monthLabel(m) }));
      return `${inf.missing ? H.notice(`Falta el dato de inflación de ${inf.missing} ${inf.missing === 1 ? 'mes' : 'meses'} del período; se tomó como 0 %, lo que subestima la inflación. Actualizalo en la sección Inflación.`) : ''}
        <div class="toolbar">
          <label class="row small">Mes base (= 100) <select id="baseSel">${H.options(opts, base)}</select></label>
          <span class="muted small">hasta ${U.monthLabel(end)}</span>
          <label class="check"><input type="checkbox" id="exExtra" ${ex ? 'checked' : ''}> Excluir gastos extraordinarios</label>
        </div>
        <div class="grid g-2" style="margin-top:0">
          ${H.panel('Gastos vs inflación', block('Gastos', expOf(base), expOf(end), 'down'))}
          ${H.panel('Ingresos vs inflación', block('Ingresos', incOf(base), incOf(end), 'up'))}
        </div>
        <div class="grid g-2">
          ${H.panel('Índices (base 100)', H.chart('chIdx', 270, 'Índices de gastos, ingresos y precios'), { sub: `${U.cap(U.monthLabel(base))} = 100` })}
          ${H.panel('Gasto nominal vs ajustado', H.chart('chAdj', 270, 'Gasto nominal y ajustado por inflación'), { sub: `Ajustado = gasto ÷ inflación acumulada desde ${U.monthLabel(base)} (pesos de ese mes)` })}
        </div>`;
    },
    mount() {
      const sel = document.getElementById('baseSel'), chk = document.getElementById('exExtra');
      if (sel) sel.addEventListener('change', e => { state.baseMonth = e.target.value; render(); });
      if (chk) chk.addEventListener('change', e => { state.excludeExtra = e.target.checked; render(); });
      const { end, base, span } = this.ctx();
      if (base >= end) return;
      const c = Charts.colors(), ex = state.excludeExtra;
      const expOf = m => { const t = Finance.month(m); return ex ? t.expenses - t.extra : t.expenses; };
      const e0 = expOf(base), i0 = Finance.month(base).income;
      const labels = span.map(m => U.monthLabel(m, true));
      Charts.make('chIdx', {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Gastos', data: span.map(m => (e0 && Finance.hasData(m) ? expOf(m) / e0 * 100 : null)), borderColor: c.celeste, backgroundColor: c.celeste, tension: 0.25, pointRadius: 2 },
          { label: 'Ingresos', data: span.map(m => (i0 && Finance.hasData(m) ? Finance.month(m).income / i0 * 100 : null)), borderColor: c.good, backgroundColor: c.good, tension: 0.25, pointRadius: 2 },
          { label: 'Precios (inflación)', data: span.map(m => Finance.cumInflation(base, m).factor * 100), borderColor: c.bad, backgroundColor: c.bad, borderDash: [6, 3], tension: 0.25, pointRadius: 0 }
        ] },
        options: Charts.opts({ cur: 'IDX' })
      });
      Charts.make('chAdj', {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Nominal', data: span.map(m => (Finance.hasData(m) ? expOf(m) : null)), borderColor: c.celeste, backgroundColor: c.celeste, tension: 0.25, pointRadius: 2 },
          { label: 'Ajustado por inflación', data: span.map(m => (Finance.hasData(m) ? expOf(m) / Finance.cumInflation(base, m).factor : null)), borderColor: c.violet, backgroundColor: c.violet, borderDash: [6, 3], tension: 0.25, pointRadius: 2 }
        ] },
        options: Charts.opts()
      });
    }
  },
  usd: {
    type() { return state.usdType || Store.data.settings.dollarType; },
    render() {
      const ty = this.type(), ym = state.month, r = FX.monthRate(ym, ty);
      const seg = `<div class="seg" role="group" aria-label="Tipo de dólar">${DOLLAR_TYPES.slice(0, 3).map(t => `<button type="button" class="${ty === t.id ? 'on' : ''}" aria-pressed="${ty === t.id}" data-act="usd-type" data-arg="${t.id}">${t.label}</button>`).join('')}</div>`;
      if (!r) return H.notice('No hay cotizaciones para convertir. Actualizalas desde la sección Dólar.');
      const t = Finance.month(ym), pm = U.addMonths(ym, -1), rp = FX.monthRate(pm, ty), pT = Finance.month(pm);
      const usdNow = FX.rateOn(U.today(), ty), pat = Finance.patrimonyNow();
      const chExp = Finance.hasData(pm) && rp ? U.change(t.expenses / r, pT.expenses / rp) : null;
      const cell = (lbl, v, sub) => `<div class="cell"><div class="cell-label">${lbl}</div><div class="cell-value num">${v}</div><div class="cell-sub">${sub || ''}</div></div>`;
      return `<div class="toolbar">${seg}<span class="muted small">Conversión con el promedio mensual del dólar ${dollarLabel(ty)}. Útil para comparar sin el ruido de la inflación en pesos.</span></div>
        <div class="ledger" style="margin-top:0">
          ${cell('Ingreso del mes', U.usd(t.income / r), `<span class="line">${Finance.hasData(pm) && rp ? trendBadge(U.change(t.income / r, pT.income / rp), 'up') + ' vs mes anterior' : ''}</span>`)}
          ${cell('Gasto del mes', U.usd(t.expenses / r), `<span class="line">${chExp != null ? trendBadge(chExp, 'down') + ' vs mes anterior' : ''}</span>`)}
          ${cell('Ahorro del mes', U.usd((t.income - t.expenses) / r), '')}
          ${cell('Patrimonio', usdNow ? U.usd(pat.total / usdNow) : '—', `Cotización ${dollarLabel(ty)} promedio del mes: ${U.ars(r)}`)}
        </div>
        <div class="grid">${H.panel('Ingresos, gastos y ahorro en dólares', H.chart('chUsdFlows', 280, 'Flujos mensuales en dólares'), { tools: H.range() })}</div>
        <div class="grid">${H.panel('Patrimonio en dólares', H.chart('chUsdPat', 240, 'Patrimonio mensual en dólares'), { sub: 'Según los cierres mensuales registrados en Patrimonio' })}</div>`;
    },
    mount() {
      const ty = this.type(), c = Charts.colors(), months = Finance.range(state.month, state.range);
      if (!FX.monthRate(state.month, ty)) return;
      const labels = months.map(m => U.monthLabel(m, true));
      const conv = (m, v) => { const r = FX.monthRate(m, ty); return r && Finance.hasData(m) ? v / r : null; };
      Charts.make('chUsdFlows', {
        type: 'line',
        data: { labels, datasets: [
          { label: 'Ingresos', data: months.map(m => conv(m, Finance.month(m).income)), borderColor: c.good, backgroundColor: c.good, tension: 0.3, pointRadius: 2 },
          { label: 'Gastos', data: months.map(m => conv(m, Finance.month(m).expenses)), borderColor: c.celeste, backgroundColor: c.celeste, tension: 0.3, pointRadius: 2 },
          { label: 'Ahorro', data: months.map(m => conv(m, Finance.month(m).income - Finance.month(m).expenses)), borderColor: c.warn, backgroundColor: c.warn, tension: 0.3, pointRadius: 2 }
        ] },
        options: Charts.opts({ cur: 'USD' })
      });
      const snaps = Finance.snapshots().filter(s => s.month <= state.month).slice(-24);
      if (!snaps.length) { Charts.fallback('chUsdPat', 'Registrá cierres mensuales en Patrimonio para ver esta evolución.'); return; }
      Charts.make('chUsdPat', {
        type: 'bar',
        data: { labels: snaps.map(s => U.monthLabel(s.month, true)), datasets: [{ label: 'Patrimonio', data: snaps.map(s => { const r = FX.monthRate(s.month, ty); return r ? s.total / r : null; }), backgroundColor: c.good, borderRadius: 3 }] },
        options: Charts.opts({ cur: 'USD', legend: false })
      });
    }
  },
  evolucion: {
    render() {
      const keys = Finance.cache().keys, snap = Finance.snapshotMap();
      const years = [...new Set(keys.map(k => k.slice(0, 4)))].reverse();
      let rows = keys.filter(k => state.evoYear === 'all' || k.startsWith(state.evoYear)).map(m => {
        const t = Finance.month(m), r = FX.monthRate(m);
        return { month: m, income: t.income, expenses: t.expenses, savings: t.income - t.expenses, rate: Finance.savingsRate(m), investment: t.investment, patrimony: snap[m] ? snap[m].total : null, usd: r ? t.expenses / r : null, inflation: Finance.inflMap()[m] ?? null };
      });
      const { key, dir } = state.sort;
      rows.sort((a, b) => { const x = a[key], y = b[key]; if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'asc' ? 1 : -1); });
      const cols = [['month', 'Mes', false], ['income', 'Ingresos', true], ['expenses', 'Gastos', true], ['savings', 'Ahorro', true], ['rate', 'Ahorro %', true], ['investment', 'Inversión', true], ['patrimony', 'Patrimonio', true], ['usd', 'Gastos USD', true], ['inflation', 'Inflación', true]];
      const th = ([k, l, n]) => `<th class="sortable ${n ? 'n' : ''}" data-act="sort" data-arg="${k}" aria-sort="${key === k ? (dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${l}${key === k ? (dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`;
      const tot = { income: U.sum(rows, r => r.income), expenses: U.sum(rows, r => r.expenses), investment: U.sum(rows, r => r.investment) };
      return `<div class="toolbar"><label class="row small">Año <select id="yearSel"><option value="all">Todos</option>${H.options(years, state.evoYear)}</select></label><span class="muted small">Tocá un encabezado para ordenar.</span></div>
        <div class="table-wrap"><table class="data"><thead><tr>${cols.map(th).join('')}</tr></thead><tbody>
        ${rows.map(r => `<tr><td>${U.cap(U.monthLabel(r.month))}</td><td class="n">${U.ars(r.income)}</td><td class="n">${U.ars(r.expenses)}</td><td class="n ${r.savings < 0 ? 'neg' : ''}">${U.ars(r.savings)}</td><td class="n">${U.pct(r.rate, 1)}</td><td class="n">${U.ars(r.investment)}</td><td class="n">${r.patrimony != null ? U.ars(r.patrimony) : '—'}</td><td class="n">${U.usd(r.usd)}</td><td class="n">${U.pct(r.inflation, 1)}</td></tr>`).join('')}

    },
    mount() { const s = document.getElementById('yearSel'); if (s) s.addEventListener('change', e => { state.evoYear = e.target.value; render(); }); }
  }
};

/* =====================================================================
   12. ACCIONES (delegación de eventos)
   ===================================================================== */
async function withBusy(btnId, fn) {
  const b = document.getElementById(btnId);
  if (b) { b.disabled = true; b.dataset.label = b.innerHTML; b.textContent = 'Consultando…'; }
  try { await fn(); }
  finally { if (b && document.contains(b)) { b.disabled = false; b.innerHTML = b.dataset.label; } }
}

const ACTIONS = {
  'toggle-menu': () => $('#sidebar').classList.toggle('open'),
  'toggle-theme': () => { LocalPrefs.setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); applyTheme(); render(); },
  'month-step': arg => { state.month = U.addMonths(state.month, +arg); render(); },
  'range': arg => { state.range = arg === 'all' ? 'all' : +arg; render(); },
  'dollar-days': arg => { state.dollarDays = +arg; render(); },
  'usd-type': arg => { state.usdType = arg; render(); },
  'analysis-tab': arg => { state.analysisTab = arg; render(); },
  'sort': arg => { const s = state.sort; state.sort = { key: arg, dir: s.key === arg && s.dir === 'desc' ? 'asc' : 'desc' }; render(); },

  'add-expense': () => Forms.expense(),
  'edit-expense': id => Forms.expense(Store.find('expenses', id)),
  'del-expense': id => Forms.deleteExpense(id),
  'add-income': () => Forms.income(),
  'edit-income': id => Forms.income(Store.find('income', id)),
  'del-income': id => confirmDelete('income', id, 'este ingreso'),
  'add-investment': () => Forms.investment(),
  'edit-investment': id => Forms.investment(Store.find('investments', id)),
  'contrib-investment': id => Forms.investment(Store.find('investments', id), true),
  'del-investment': id => confirmDelete('investments', id, 'esta inversión'),
  'add-asset': () => Forms.asset(),
  'edit-asset': id => Forms.asset(Store.find('assets', id)),
  'del-asset': id => confirmDelete('assets', id, 'este activo'),
  'add-liability': () => Forms.liability(),
  'edit-liability': id => Forms.liability(Store.find('liabilities', id)),
  'del-liability': id => confirmDelete('liabilities', id, 'esta deuda'),
  'del-snapshot': id => confirmDelete('monthlySnapshots', id, 'este cierre mensual'),
  'snapshot': () => {
    const ym = state.month, p = Finance.patrimonyNow();
    const ex = Store.data.monthlySnapshots.find(s => s.month === ym);
    const save = () => {
      Store.data.monthlySnapshots = Store.data.monthlySnapshots.filter(s => s.month !== ym);
      Store.add('monthlySnapshots', { month: ym, assets: p.assets, investments: p.investments, liabilities: p.liabilities, total: p.total });
      toast(`Cierre de ${U.monthLabel(ym)} registrado: ${U.ars(p.total)}`, 'good'); render();
    };
    if (ex) confirmDialog({ title: 'Reemplazar cierre', html: `<p>Ya hay un cierre para ${U.monthLabel(ym)} (${U.ars(ex.total)}). ¿Reemplazarlo por los valores actuales (${U.ars(p.total)})?</p>`, buttons: [{ label: 'Cancelar' }, { label: 'Reemplazar', cls: 'primary', onClick: save }] });
    else save();
  },
  'add-inflation': () => Forms.inflation(),
  'del-inflation': id => confirmDelete('inflation', id, 'este dato de inflación'),
  'import-inflation-csv': () => Backup.importInflationCSV(),
  'refresh-inflation': () => withBusy('btnInfl', async () => {
    try { const n = await InflationService.refresh(); toast(`Inflación actualizada: ${n} meses`, 'good'); render(); }
    catch (e) { toast(`No se pudo consultar la inflación (${e.message}). Podés cargarla a mano o importar un CSV.`, 'error'); }
  }),
  'add-rate': () => Forms.rate(),
  'refresh-rates': () => withBusy('btnRates', async () => {
    try { const n = await RatesService.refreshCurrent(); toast(`Cotizaciones actualizadas (${n})`, 'good'); render(); }
    catch (e) { toast(`No se pudo consultar la cotización (${e.message}). Podés cargarla a mano.`, 'error'); }
  }),
  'download-rates': () => withBusy('btnHist', async () => {
    const { total, errors } = await RatesService.downloadHistory();
    if (total) toast(`Histórico guardado: ${total} cotizaciones${errors.length ? `. Fallaron: ${errors.join('; ')}` : ''}`, errors.length ? 'error' : 'good');
    else toast(`No se pudo descargar el histórico. ${errors.join('; ')}`, 'error');
    render();
  }),

  'export-json': () => Backup.exportJSON(),
  'import-json': () => Backup.importJSON(),
  'export-csv': () => Backup.exportCSV(),
  'import-csv': () => Backup.importCSV(),
  'load-demo': () => {
    const go = () => { Demo.generate(); state.month = U.addMonths(U.thisMonth(), -1); toast(`Datos de ejemplo cargados. Se muestra ${U.monthLabel(state.month)}, el último mes completo.`, 'good'); location.hash = 'dashboard'; render(); };
    if (Store.data.income.length + Store.data.expenses.length > 0 && !Demo.has()) confirmDialog({ title: 'Cargar datos de ejemplo', html: '<p>Los datos de ejemplo se agregan a los tuyos. Después podés borrarlos desde Configuración sin afectar lo que cargaste.</p>', buttons: [{ label: 'Cancelar' }, { label: 'Cargar', cls: 'primary', onClick: go }] });
    else go();
  },
  'clear-demo': () => confirmDialog({ title: 'Borrar datos de ejemplo', html: '<p>Se eliminan solo los datos de ejemplo. Lo que cargaste vos queda intacto.</p>', buttons: [{ label: 'Cancelar' }, { label: 'Borrar ejemplo', cls: 'danger solid', onClick: () => { Demo.clear(); state.month = Finance.lastMonth() || U.thisMonth(); toast('Datos de ejemplo eliminados', 'good'); render(); } }] }),
  'reset-all': () => confirmDialog({ title: 'Borrar todos los datos', html: '<p>Se elimina todo lo guardado: movimientos, inversiones, patrimonio, cotizaciones, inflación y preferencias. Se borra para toda la familia y no se puede deshacer.</p>', buttons: [{ label: 'Cancelar' }, { label: 'Exportar backup antes', onClick: () => Backup.exportJSON() }, { label: 'Borrar todo', cls: 'danger solid', onClick: () => { Store.replace(null); state.month = U.thisMonth(); applyTheme(); toast('Datos eliminados', 'good'); render(); } }] }),

  'save-settings': () => {
    const s = Store.data.settings;
    const goal = parseFloat($('#setGoal').value), em = parseFloat($('#setEm').value);
    if (!(goal >= 0 && goal <= 100)) { toast('La meta de ahorro tiene que estar entre 0 y 100.', 'error'); return; }
    if (!(em >= 1)) { toast('El fondo de emergencia tiene que ser de al menos 1 mes.', 'error'); return; }
    s.members = [$('#setM1').value.trim() || 'Integrante 1', $('#setM2').value.trim() || 'Integrante 2'];
    s.dollarType = $('#setDollar').value; s.savingsGoal = goal; s.emergencyMonths = em; s.rateProvider = $('#setProv').value;
    Store.save(); toast('Preferencias guardadas', 'good'); render();
  },
  'copy-code': code => {
    const done = () => toast('Código copiado', 'good');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => toast(`Código: ${code}`, 'info'));
    else toast(`Código: ${code}`, 'info');
  },
  'new-code': () => confirmDialog({ title: 'Generar código nuevo', html: '<p>El código actual deja de servir. Quienes ya están en la familia no se ven afectados.</p>', buttons: [{ label: 'Cancelar' }, { label: 'Generar', cls: 'primary', onClick: async () => {
    const { data, error } = await Cloud.sb.rpc('regenerar_codigo');
    if (error) { toast(authMsg(error), 'error'); return; }
    Cloud.family.codigo_invitacion = data; toast('Código nuevo generado', 'good'); render();
  } }] }),
  'cloud-refresh': async () => { const changed = await Cloud.refresh(true); if (changed === false && Sync.status !== 'error') toast('Ya tenés la última versión', 'good'); },
  'logout': () => {
    const pend = !Ops.isEmpty(Cloud.pending) || Cloud.inflight;
    confirmDialog({ title: 'Cerrar sesión', html: pend ? '<p>Hay cambios que todavía no llegaron a la nube. Si cerrás sesión ahora se pierden. Esperá a que el indicador diga "Guardado en la nube".</p>' : '<p>Se borra la copia local de este dispositivo. Tus datos siguen en la nube.</p>',
      buttons: [{ label: 'Cancelar' }, { label: 'Cerrar sesión', cls: 'danger solid', onClick: () => Auth.logout() }] });
  },
  'add-category': () => Forms.categoryName(null),
  'rename-category': id => Forms.categoryName(catById(id)),
  'del-category': id => {
    const c = catById(id); if (!c) return;
    const used = Store.data.expenses.filter(r => r.categoryId === id).length;
    let other = Store.data.categories.find(x => x.name === 'Otros' && x.id !== id);
    confirmDialog({
      title: 'Eliminar categoría',
      html: used ? `<p>"${U.esc(c.name)}" tiene ${used} gastos. Si la eliminás, esos gastos pasan a la categoría "Otros".</p>` : `<p>¿Eliminar la categoría "${U.esc(c.name)}"?</p>`,
      buttons: [{ label: 'Cancelar' }, { label: 'Eliminar', cls: 'danger solid', onClick: () => {
        if (used) {
          if (!other) { other = { id: U.uid(), name: 'Otros', subs: ['Varios'], color: '#5E6C84' }; Store.data.categories.push(other); }
          Store.data.expenses.forEach(r => { if (r.categoryId === id) { r.categoryId = other.id; r.subcategory = r.subcategory || ''; } });
        }
        Store.data.categories = Store.data.categories.filter(x => x.id !== id);
        Store.save(); toast('Categoría eliminada', 'good'); render();
      } }]
    });
  },
  'add-sub': id => Forms.subcategory(catById(id)),
  'del-sub': arg => { const [id, i] = arg.split('|'); const c = catById(id); if (!c) return; c.subs.splice(+i, 1); Store.save(); render(); }
};

/* =====================================================================
   13. APP: render, navegación, tema
   ===================================================================== */
function applyTheme() {
  const pref = LocalPrefs.theme();
  const theme = pref || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0A111C' : '#14213D');
  const b = $('#themeBtn');
  if (b) { b.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon'); b.setAttribute('aria-label', theme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'); }
}

function renderNav() {
  $('#nav').innerHTML = NAV.map(n => n.sep ? '<div class="nav-sep" role="separator"></div>'
    : `<a href="#${n.id}" class="${n.soon ? 'soon' : ''}" ${state.view === n.id ? 'aria-current="page"' : ''}>${icon(n.icon)}<span>${n.label}</span>${n.soon ? '<span class="tag">pronto</span>' : ''}</a>`).join('');
  const s = Store.data.settings, l = FX.latest(s.dollarType);
  $('#sideFoot').innerHTML = `${l ? `Dólar ${dollarLabel(s.dollarType)}: ${U.ars(l.sell)}` : ''}<div class="sync" id="syncStatus" role="status"></div><button type="button" class="linklike side-link" data-act="logout">Cerrar sesión</button>`;
  renderSyncStatus();
}

function renderMonthSelect() {
  const sel = $('#monthSelect');
  const now = U.thisMonth(), first = Finance.firstMonth();
  let from = U.addMonths(now, -24);
  if (first && first < from) from = first;
  if (state.month < from) from = state.month;
  let to = U.addMonths(now, 2);
  if (state.month > to) to = state.month;
  const months = U.monthsBetween(from, to).reverse();
  sel.innerHTML = months.map(m => `<option value="${m}" ${m === state.month ? 'selected' : ''}>${U.cap(U.monthLabel(m))}${Finance.hasData(m) ? '' : ' (sin datos)'}</option>`).join('');
}

function render() {
  Charts.destroyAll();
  const v = VIEWS[state.view] || VIEWS.dashboard;
  $('#viewTitle').textContent = v.title;
  document.title = `${v.title} | Economía familiar`;
  const root = $('#view');
  try {
    root.innerHTML = v.render();
    if (v.mount) v.mount();
  } catch (e) {
    console.error(e);
    root.innerHTML = H.panel('No se pudo mostrar esta sección', `<p>Ocurrió un error inesperado: ${U.esc(e.message)}</p><p class="muted small">Tus datos siguen guardados. Probá con otra sección o exportá un backup desde Configuración.</p>`);
  }
  renderNav();
  renderMonthSelect();
}

function route() {
  const id = (location.hash || '#dashboard').slice(1);
  state.view = VIEWS[id] ? id : 'dashboard';
  $('#sidebar').classList.remove('open');
  render();
  $('#view').focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

let started = false;

function startApp() {
  const last = Finance.lastMonth();
  state.month = Finance.hasData(U.thisMonth()) || !last ? U.thisMonth() : last;
  if (!started) {
    started = true;
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const fn = ACTIONS[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el.dataset.arg, el); }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && Modal.isOpen()) Modal.close(); });
    $('#monthSelect').addEventListener('change', e => { state.month = e.target.value; render(); });
    window.addEventListener('hashchange', route);
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!LocalPrefs.theme()) { applyTheme(); render(); } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Cloud.refresh(); });
    setInterval(() => { if (document.visibilityState === 'visible') Cloud.refresh(); }, 60000);
    window.addEventListener('online', () => Cloud.kick());
  }
  route();
  renderSyncStatus();
  if (Sync.notice === 'recovered') toast('Se subieron cambios que habían quedado pendientes en este dispositivo.', 'good');
  if (Sync.notice === 'offline') toast('Sin conexión: se muestran los datos guardados en este dispositivo. Los cambios se suben cuando vuelva internet.', 'info');
  Sync.notice = '';
}

async function boot() {
  $('#brandMark').innerHTML = Array.from({ length: 12 }, (_, i) => `<ellipse cx="20" cy="20" rx="17" ry="6" transform="rotate(${i * 15} 20 20)"/>`).join('');
  document.querySelector('.menu-btn').innerHTML = icon('menu', 20);
  $('#mPrev').innerHTML = icon('chevL', 18);
  $('#mNext').innerHTML = icon('chevR', 18);
  applyTheme();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('No se pudo registrar el modo app', e));
  }
  if (!Cloud.configured()) { Gate.error('Falta la configuración de Supabase en config.js.', false); return; }
  try { Cloud.connect(); } catch (e) { Gate.error(e.message); return; }
  Gate.loading('Conectando…');
  Cloud.sb.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY' && !IS_RECOVERY) setTimeout(() => Gate.newPassword(), 0);
    if (event === 'SIGNED_OUT' && started) setTimeout(() => location.reload(), 0);
  });
  const { data } = await Cloud.sb.auth.getSession();
  if (IS_RECOVERY && data.session) { Cloud.user = data.session.user; Gate.newPassword(); return; }
  if (!data.session) { Gate.login(); return; }
  await enter(data.session);
}

document.addEventListener('DOMContentLoaded', () => {
  boot().catch(e => { console.error(e); Gate.error(`No se pudo iniciar la aplicación: ${e.message}`); });
});
</script>
